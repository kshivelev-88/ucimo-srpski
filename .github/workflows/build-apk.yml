name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore app source and approved icon
        run: |
          mkdir -p www assets
          cp source/v5/index.html www/index.html
          test -s www/index.html
          cat assets/ucimo-srpski-icon.jpg.b64.part* | base64 -d > assets/ucimo-srpski-icon.jpg
          test -s assets/ucimo-srpski-icon.jpg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Patch app and bundle native audio bridge
        run: npm run build

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Declare microphone permission
        run: python scripts/configure-android.py

      - name: Generate approved launcher icons
        run: python scripts/generate-android-icons.py

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ucimo-srpski-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
