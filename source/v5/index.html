","Gde je kuhinja?|Где кухня?|Скажите: кухня рядом с гостиной|Kuhinja je pored dnevne sobe|kuhinja iza ja|Pored + родительный падеж: pored sobe.","Imaš li balkon?|У тебя есть балкон?|Скажите: нет, но есть большая терраса|Ne, ali imam veliku terasu|ne ali velika terasa|Imam veliku terasu — винительный падеж женского рода."]}],"comics":[{"t":"Комикс: знакомство с семьёй","pn":[{"s":"👨‍👩‍👧","l":["M|Ovo je moja porodica.|Это моя семья.","A|Baš lepo! Ko je ovo?|Как здорово! Кто это?"]},{"s":"👵👦","l":["M|Ovo su moja majka i brat.|Это моя мама и брат.","A|Kako se zovu?|Как их зовут?"]},{"s":"😊🏡","l":["M|Majka se zove Marina, a brat Ivan.|Маму зовут Марина, а брата — Иван.","A|Drago mi je da sam ih upoznala.|Рада, что познакомилась с ними."]}]},{"t":"Комикс: показываем новую квартиру","pn":[{"s":"🏠🔑","l":["A|Dobro došao u moj novi stan!|Добро пожаловать в мою новую квартиру!","M|Hvala! Stan izgleda svetlo.|Спасибо! Квартира выглядит светлой."]},{"s":"🛋️🍽️","l":["A|Ovo je dnevna soba, a tamo je kuhinja.|Это гостиная, а там кухня.","M|Sviđa mi se veliki prozor.|Мне нравится большое окно."]},{"s":"🌿☀️","l":["A|Imam i mali balkon.|У меня есть и маленький балкон.","M|Odlično mesto za jutarnju kafu!|Отличное место для утреннего кофе!"]}]}]},{"u":"g","dialogs":[{"t":"Планируем неделю","c":"📅","st":["Kada imaš slobodan dan?|Когда у тебя свободный день?|Скажите: в среду и воскресенье|Slobodan sam u sredu i nedelju|slobodan sreda nedelja|U sredu / u nedelju — винительный падеж после u в значении времени.","Šta radiš u petak?|Что делаешь в пятницу?|Скажите: у меня встреча после работы|Imam sastanak posle posla|imam sastanak sutra|Posle + родительный падеж: posle posla.","Možemo li u subotu na ručak?|Можем в субботу на обед?|Ответьте: да, встретимся в час|Može, vidimo se u jedan sat|može, vidim jedan|Vidimo se — «увидимся»; u jedan sat — в час."]},{"t":"Опоздание и перенос встречи","c":"📱","st":["Da li stižeš na vreme?|Ты успеваешь вовремя?|Скажите: нет, автобус задерживается|Ne, autobus kasni|ne, autobus kasnio juče|Kasni — настоящее время: задерживается.","Koliko ćeš kasniti?|Насколько опоздаешь?|Скажите: примерно пятнадцать минут|Kasniću oko petnaest minuta|kasnim petnaest sat|Будущее: kasniću; после petnaest — minuta.","Da pomerimo sastanak?|Перенесём встречу?|Скажите: давай на половину седьмого|Hajde u pola sedam|hajde sedam pola|Pola sedam — половина седьмого."]}],"comics":[{"t":"Комикс: встреча переносится","pn":[{"s":"📱🚌","l":["A|Kasnim, autobus ne dolazi.|Я опаздываю, автобус не приходит.","M|Koliko ćeš kasniti?|Насколько опоздаешь?"]},{"s":"🕒📆","l":["A|Oko dvadeset minuta.|Примерно на двадцать минут.","M|Hajde da pomerimo sastanak na šest.|Давай перенесём встречу на шесть."]},{"s":"✅🤝","l":["A|Odgovara mi. Vidimo se u šest!|Мне подходит. Увидимся в шесть!","M|Važi, čekam te.|Хорошо, жду тебя."]}]},{"t":"Комикс: выбираем день поездки","pn":[{"s":"🗓️🚗","l":["A|Kada možemo da krenemo na put?|Когда мы можем отправиться в поездку?","M|U petak posle posla.|В пятницу после работы."]},{"s":"🌤️🎒","l":["A|A šta ćemo u subotu?|А что будем делать в субботу?","M|Imaćemo ceo dan za obilazak.|У нас будет целый день на прогулку."]},{"s":"📍😊","l":["A|Odlično, onda rezervišem smeštaj.|Отлично, тогда я забронирую жильё.","M|Pošalji mi adresu kada rezervišeš.|Пришли мне адрес, когда забронируешь."]}]}]},{"u":"h","dialogs":[{"t":"Рассказываем о вчерашнем дне","c":"👨","st":["Šta si radio juče?|Что ты делал вчера?|Скажите: утром я работал, а вечером отдыхал|Ujutru sam radio, a uveče sam se odmarao|juče radim odmor|Прошедшее время: sam + причастие; мужской род: radio, odmarao.","Da li si išao u prodavnicu?|Ты ходил в магазин?|Скажите: да, я купил хлеб и молоко|Da, kupio sam hleb i mleko|kupujem hleb mleko|Совершенный вид: kupio sam — купил.","Kada si se vratio kući?|Когда ты вернулся домой?|Ответьте: около восьми|Vratio sam se oko osam|vraćam osam kuća|Vratio sam se — возвратный глагол в прошедшем времени."]},{"t":"В гостях: что делали на выходных","c":"👩","st":["Kako si provela vikend?|Как ты провела выходные?|Скажите: я была у друзей|Bila sam kod prijatelja|bio sam prijatelji|Женский род: bila sam; kod + родительный падеж.","Šta ste radili?|Что вы делали?|Скажите: мы готовили ужин и смотрели фильм|Spremali smo večeru i gledali film|spremamo večera film|Несовершенный вид описывает занятия в течение времени.","Da li ti se dopao film?|Тебе понравился фильм?|Ответьте: да, он был интересный|Da, bio je zanimljiv|da, zanimljivo bilo|Bio je — согласование с muž. rod: film."]}],"comics":[{"t":"Комикс: день после отпуска","pn":[{"s":"☕🗣️","l":["M|Kako si proveo odmor?|Как ты провёл отпуск?","A|Bio sam na moru deset dana.|Я был на море десять дней."]},{"s":"🏖️📸","l":["M|Šta si tamo radio?|Что ты там делал?","A|Plivao sam, šetao i čitao knjige.|Я плавал, гулял и читал книги."]},{"s":"😊🏢","l":["M|Da li ti nedostaje more?|Ты скучаешь по морю?","A|Naravno. Juče sam se već vratio na posao.|Конечно. Вчера я уже вернулся на работу."]}]},{"t":"Комикс: выходные у друзей","pn":[{"s":"🍲🏡","l":["A|U subotu smo bili kod prijatelja.|В субботу мы были у друзей.","M|Šta ste radili?|Что вы делали?"]},{"s":"🎬🍿","l":["A|Prvo smo spremili večeru, a zatim gledali film.|Сначала приготовили ужин, а затем посмотрели фильм.","M|Da li vam se dopao?|Вам понравился?"]},{"s":"🚶‍♀️🌙","l":["A|Da, ali kući smo otišli prilično kasno.|Да, но домой мы ушли довольно поздно.","M|Zvuči kao lep vikend!|Похоже, выходные были хорошими!"]}]}]},{"u":"i","dialogs":[{"t":"Планы на следующий месяц","c":"📆","st":["Šta ćeš raditi sledećeg meseca?|Что будешь делать в следующем месяце?|Скажите: я буду искать новую квартиру|Tražiću novi stan|tražio sam stan juče|Будущее: tražiću — буду искать.","Da li ćeš se preseliti daleko?|Ты переедешь далеко?|Скажите: нет, останусь в этом районе|Ne, ostaću u ovom kraju|ostao sam u kraj|Ostaću — будущее от ostati; u ovom kraju — местный падеж.","Kada počinješ da tražiš?|Когда начнёшь искать?|Скажите: начну на следующей неделе|Počeću sledeće nedelje|počeo sam prošle nedelje|Počeću — будущее от početi."]},{"t":"Договориться о встрече","c":"📱","st":["Hoćeš li doći na večeru sutra?|Придёшь завтра на ужин?|Скажите: да, с удовольствием приду|Da, rado ću doći|rado sam došao sutra|Rado ću doći — охотно приду.","U koliko sati ti odgovara?|Во сколько тебе удобно?|Ответьте: после семи|Odgovara mi posle sedam|odgovaralo juče sedam|Odgovara mi — мне подходит; posle + родительный.","Da li da nešto ponesem?|Принести что-нибудь?|Скажите: принеси, пожалуйста, сок|Ponesi sok, molim te|ponela sam hleb juče|Ponesi — повелительная форма на «ты»."]}],"comics":[{"t":"Комикс: собеседование назначено","pn":[{"s":"📩💼","l":["A|Pozvali su me na razgovor za posao.|Меня пригласили на собеседование.","M|Odlično! Kada će biti?|Отлично! Когда оно будет?"]},{"s":"📅🕙","l":["A|Biće sledećeg utorka u deset.|Оно будет в следующий вторник в десять.","M|Šta ćeš pripremiti?|Что ты подготовишь?"]},{"s":"📝✅","l":["A|Pripremiću biografiju i nekoliko pitanja.|Я подготовлю резюме и несколько вопросов.","M|Siguran sam da će proći dobro.|Уверен, всё пройдёт хорошо."]}]},{"t":"Комикс: планы на отпуск","pn":[{"s":"✈️🌍","l":["A|Gde ćete putovati ovog leta?|Куда вы поедете этим летом?","M|Ići ćemo u Crnu Goru.|Мы поедем в Черногорию."]},{"s":"🏖️📆","l":["A|Koliko ćete ostati?|Сколько вы там пробудете?","M|Ostaćemo deset dana.|Мы останемся на десять дней."]},{"s":"🎒😊","l":["A|Šta ćete poneti?|Что возьмёте с собой?","M| ponećemo laganu odeću i fotoaparat.|Возьмём лёгкую одежду и фотоаппарат."]}]}]},{"u":"j","dialogs":[{"t":"Просмотр квартиры","c":"🏠","st":["Dobar dan. Da li tražite stan?|Добрый день. Вы ищете квартиру?|Скажите: да, двухкомнатную, недалеко от центра|Da, dvosoban stan blizu centra|da dve sobe centar|Dvosoban stan — двухкомнатная квартира; blizu + родительный.","Koliki vam je budžet?|Какой у вас бюджет?|Скажите: до шестисот евро в месяц|Do šeststo evra mesečno|šeststo euro nedelja|Do + родительный падеж: do šeststo evra.","Kada želite da pogledate stan?|Когда хотите посмотреть квартиру?|Скажите: завтра после работы|Sutra posle posla|juče posao ujutru|Posle + родительный: posle posla."]},{"t":"Сообщаем хозяину о проблеме","c":"🔧","st":["Dobar dan. Šta nije u redu u stanu?|Добрый день. Что не так в квартире?|Скажите: отопление не работает|Grejanje ne radi|grejanje radio juče|Ne radi — отрицание в настоящем времени.","Od kada imate taj problem?|С какого времени у вас эта проблема?|Скажите: с прошлой ночи|Od prošle noći|od prošla noć|Od + родительный падеж: od prošle noći.","Poslaću majstora sutra.|Я пришлю мастера завтра.|Поблагодарите и уточните время|Hvala. U koliko sati?|hvala gde majstor|U koliko sati? — во сколько?"]}],"comics":[{"t":"Комикс: выбираем квартиру","pn":[{"s":"🏢🔑","l":["A|Dobar dan, došli smo da pogledamo stan.|Добрый день, мы пришли посмотреть квартиру.","B|Izvolite, stan je na trećem spratu.|Пожалуйста, квартира на третьем этаже."]},{"s":"🛋️🍽️","l":["A|Kolika je mesečna kirija?|Какая ежемесячная аренда?","B|Petsto evra, plus računi.|Пятьсот евро плюс коммунальные платежи."]},{"s":"📝🤝","l":["A|Stan nam odgovara. Kada možemo da potpišemo ugovor?|Квартира нам подходит. Когда можем подписать договор?","B|Možemo već sutra.|Можем уже завтра."]}]},{"t":"Комикс: не работает отопление","pn":[{"s":"❄️🏠","l":["A|U stanu je veoma hladno.|В квартире очень холодно.","B|Da li grejanje radi?|Отопление работает?"]},{"s":"🔧📞","l":["A|Ne radi od sinoć.|Не работает со вчерашнего вечера.","B|Pozvaću majstora odmah.|Я сейчас вызову мастера."]},{"s":"👍☀️","l":["A|Hvala. Nadam se da će brzo doći.|Спасибо. Надеюсь, он скоро приедет.","B|Javiću vam čim potvrdim termin.|Я сообщу вам, как только подтвержу время."]}]}]},{"u":"k","dialogs":[{"t":"Возврат товара","c":"🛍️","st":["Dobar dan. Kako mogu da pomognem?|Добрый день. Чем могу помочь?|Скажите: я хотел бы вернуть эту рубашку|Želeo bih da vratim ovu košulju|želim vratiti košulja|Želeo bih da… — вежливая условная форма; ovu košulju — винительный.","Da li imate račun?|У вас есть чек?|Ответьте: да, вот чек|Da, izvolite račun|da račun juče|Izvolite — «вот, пожалуйста».","Želite li novac nazad ili zamenu?|Хотите деньги назад или обмен?|Попросите обменять на больший размер|Želeo bih veću veličinu|želim veći broj juče|Veću veličinu — винительный падеж женского рода."]},{"t":"На рынке: уточнить количество","c":"🥕","st":["Koliko jabuka želite?|Сколько яблок хотите?|Попросите один килограмм яблок|Jedan kilogram jabuka, molim|jedna kilogram jabuka|Kilogram — мужской род: jedan kilogram; jabuka — родительный множественного.","Da li želite i kruške?|Хотите ещё груши?|Скажите: да, полкилограмма|Da, pola kilograma|da pola kilo|Pola килограмма — pola kilograma.","To je četiristo dinara.|Это четыреста динаров.|Попросите пакет|Možete li da mi date kesu?|daj kesa ja|Dajte mi / možete li da mi date — просьба."]}],"comics":[{"t":"Комикс: возвращаем неподходящую рубашку","pn":[{"s":"👕🛍️","l":["A|Želeo bih da vratim ovu košulju.|Я хотел бы вернуть эту рубашку.","B|Da li je košulja nošena?|Рубашку носили?"]},{"s":"🧾🔎","l":["A|Ne, imam i račun.|Нет, и чек у меня есть.","B|Da li želite drugu veličinu?|Хотите другой размер?"]},{"s":"✅🙂","l":["A|Da, ovu sam kupio preveliku.|Да, эту я купил слишком большую.","B|U redu, zamenićemo je.|Хорошо, мы её обменяем."]}]},{"t":"Комикс: покупаем фрукты на рынке","pn":[{"s":"🍎⚖️","l":["B|Izvolite, šta želite?|Пожалуйста, что желаете?","A|Kilogram jabuka i pola kilograma krušaka.|Килограмм яблок и полкилограмма груш."]},{"s":"🛍️💶","l":["B|Još nešto?|Что-нибудь ещё?","A|Ne, hvala. Koliko košta?|Нет, спасибо. Сколько стоит?"]},{"s":"😊🥕","l":["B|Tri stotine dinara.|Триста динаров.","A|Izvolite. Prijatno!|Пожалуйста. Всего доброго!"]}]}]},{"u":"r","dialogs":[{"t":"В банке: открыть счёт","c":"🏦","st":["Dobar dan. Šta želite da uradite?|Добрый день. Что вы хотите сделать?|Скажите: я хотел бы открыть текущий счёт|Želeo bih da otvorim tekući račun|želim račun otvarao juče|Želeo bih da… — вежливая форма просьбы.","Da li imate pasoš i dokaz o adresi?|У вас есть паспорт и подтверждение адреса?|Скажите: паспорт есть, подтверждения адреса пока нет|Imam pasoš, ali još nemam dokaz o adresi|imam pasoš gde adresa|Ali — «но»; još nemam — «пока нет».","Možete ga dostaviti elektronskom poštom.|Можете предоставить его по электронной почте.|Уточните, можно ли отправить завтра|Mogu li da ga pošaljem sutra?|pošalji juče gde|Mogu li da… — вопрос о возможности."]},{"t":"На почте: отправить посылку","c":"📮","st":["Šta šaljete?|Что отправляете?|Ответьте: небольшую посылку в Нови-Сад|Šaljem mali paket u Novi Sad|šaljem mala paket Novi Sad|Paket — мужской род: mali paket.","Da li želite preporučenu pošiljku?|Хотите заказное отправление?|Спросите, сколько это стоит|Koliko to košta?|koliko pošta tamo|Koliko košta? — сколько стоит?","Može stići za dva dana.|Может прийти за два дня.|Скажите: отлично, оформляйте, пожалуйста|Odlično, pošaljite, molim vas|odlično juče pošta|Pošaljite — вежливая повелительная форма."]}],"comics":[{"t":"Комикс: открываем банковский счёт","pn":[{"s":"🏦🪪","l":["B|Dobar dan. Želite li da otvorite račun?|Добрый день. Хотите открыть счёт?","A|Da. Koji dokumenti su mi potrebni?|Да. Какие документы мне нужны?"]},{"s":"📄✍️","l":["B|Pasoš i dokaz o adresi.|Паспорт и подтверждение адреса.","A|Pasoš imam, a potvrdu mogu da donesem sutra.|Паспорт у меня есть, а подтверждение могу принести завтра."]},{"s":"💳✅","l":["B|U redu. Tada ćemo završiti postupak.|Хорошо. Тогда мы завершим процедуру.","A|Hvala na pomoći.|Спасибо за помощь."]}]},{"t":"Комикс: отправка посылки","pn":[{"s":"📦📮","l":["A|Želim da pošaljem ovaj paket u Novi Sad.|Я хочу отправить эту посылку в Нови-Сад.","B|Da li želite brzu dostavu?|Хотите быструю доставку?"]},{"s":"💶📝","l":["A|Koliko košta i koliko traje?|Сколько стоит и сколько длится?","B|Košta petsto dinara, stiže za dva dana.|Стоит пятьсот динаров, придёт за два дня."]},{"s":"✅🤝","l":["A|U redu, šaljite preporučeno.|Хорошо, отправляйте заказным.","B|Izvolite potvrdu.|Вот квитанция."]}]}]},{"u":"s","dialogs":[{"t":"Попросить совет у врача","c":"🩺","st":["Šta vas muči?|Что вас беспокоит?|Скажите: у меня болит горло уже два дня|Boli me grlo već dva dana|bolim grlo dva dan|Boli me grlo — буквально «болит мне горло».","Da li imate temperaturu?|У вас есть температура?|Скажите: небольшая температура|Imam blagu temperaturu|imam malo temperatura|Temperaturu — винительный падеж.","Trebalo bi da odmarate i pijete vodu.|Вам следовало бы отдыхать и пить воду.|Спросите, нужно ли принимать лекарство|Da li treba da uzimam lek?|da lek juče uzimam|Treba da + настоящее время: treba da uzimam."]},{"t":"Попросить коллегу помочь","c":"💻","st":["Možeš li da mi pomogneš oko izveštaja?|Можешь помочь мне с отчётом?|Скажите: конечно, покажи, что нужно сделать|Naravno, pokaži mi šta treba da uradim|naravno uradio juče|Pokaži — повелительная форма на «ты».","Treba da proverimo ove podatke.|Нужно проверить эти данные.|Предложите начать с первой таблицы|Hajde da počnemo od prve tabele|počeli smo druga|Hajde da… — предложение совместного действия.","Hvala ti na pomoći.|Спасибо тебе за помощь.|Ответьте: не за что, обращайся|Nema na čemu, slobodno se obrati|nema hvala juče|Nema na čemu — «не за что»."]}],"comics":[{"t":"Комикс: визит к врачу","pn":[{"s":"🩺🏥","l":["B|Dobar dan. Šta vas muči?|Добрый день. Что вас беспокоит?","A|Boli me grlo i imam temperaturu.|У меня болит горло и есть температура."]},{"s":"🌡️💊","l":["B|Trebalo bi da odmarate i pijete dosta tečnosti.|Вам следовало бы отдыхать и пить достаточно жидкости.","A|Da li treba da dođem ponovo?|Нужно прийти ещё раз?"]},{"s":"📅✅","l":["B|Ako ne bude bolje, dođite za dva dana.|Если не станет лучше, приходите через два дня.","A|Hvala vam na savetu.|Спасибо вам за совет."]}]},{"t":"Комикс: просим коллегу о помощи","pn":[{"s":"💻📊","l":["A|Možeš li da mi pomogneš sa ovom tabelom?|Можешь помочь мне с этой таблицей?","M|Naravno. Šta nije jasno?|Конечно. Что непонятно?"]},{"s":"🔎🧮","l":["A|Ne znam kako da izračunam ukupan iznos.|Не знаю, как рассчитать общую сумму.","M|Prvo saberi ove vrednosti.|Сначала сложи эти значения."]},{"s":"👍✅","l":["A|Sada razumem. Hvala ti!|Теперь понимаю. Спасибо тебе!","M|Nema na čemu. Javi ako zatreba još nešto.|Не за что. Дай знать, если понадобится что-то ещё."]}]}]},{"u":"t","dialogs":[{"t":"Объяснить, почему не пришёл","c":"📱","st":["Zašto nisi došao juče?|Почему ты вчера не пришёл?|Скажите: я не пришёл, потому что плохо себя чувствовал|Nisam došao zato što se nisam osećao dobro|nisam dolazim jer dobro|Zato što вводит причину; прошедшее время: nisam se osećao.","Da li si sada bolje?|Сейчас тебе лучше?|Скажите: да, поэтому сегодня я работаю|Da, zato danas radim|da zato radio juče|Zato — «поэтому», связывает следствие с причиной.","Hoćeš li doći sutra?|Придёшь завтра?|Ответьте: если буду здоров, обязательно|Ako budem zdrav, sigurno ću doći|ako sam juče zdrav|Ako budem — условие о будущем."]},{"t":"Написать короткое сообщение","c":"💬","st":["Možeš li da pošalješ poruku Ani?|Можешь отправить сообщение Ане?|Скажите: конечно, напишу ей сейчас|Naravno, pisaću joj sada|pisao sam joj juče|Joj — краткая форма дательного падежа «ей».","Šta da joj kažem?|Что ей сказать?|Скажите: встреча начнётся в шесть|Sastanak počinje u šest|počinje juče osam|Настоящее время может обозначать запланированное будущее.","Dodaj da ću malo kasniti.|Добавь, что я немного опоздаю.|Подтвердите: хорошо, добавлю|U redu, dodaću|dodao sam juče|Dodaću — будущее время от dodati."]}],"comics":[{"t":"Комикс: объясняем причину опоздания","pn":[{"s":"📱🕘","l":["A|Izvini što kasnim.|Извини, что опаздываю.","M|Šta se dogodilo?|Что случилось?"]},{"s":"🚌🚧","l":["A|Autobus nije došao na vreme zato što je bila gužva.|Автобус не пришёл вовремя, потому что были пробки.","M|Razumem. Zato si stigao kasnije.|Понимаю. Поэтому ты приехал позже."]},{"s":"☕🤝","l":["A|Hvala što si sačekao.|Спасибо, что подождал.","M|Nema problema, hajde da popijemo kafu.|Без проблем, давай выпьем кофе."]}]},{"t":"Комикс: отправляем сообщение","pn":[{"s":"📲💬","l":["A|Jesi li javio Ani za sastanak?|Ты сообщил Ане о встрече?","M|Nisam još. Šta da joj napišem?|Ещё нет. Что ей написать?"]},{"s":"🗓️✉️","l":["A|Napiši da počinje u šest, ali da možda kasnimo.|Напиши, что она начинается в шесть, но мы, возможно, опоздаем.","M|U redu, poslaću joj poruku.|Хорошо, отправлю ей сообщение."]},{"s":"✅📱","l":["M|Poslao sam. Rekla je da će sačekati.|Отправил. Она сказала, что подождёт.","A|Odlično, hvala ti!|Отлично, спасибо тебе!"]}]}]},{"u":"u","dialogs":[{"t":"У врача: падежи в реальной речи","c":"🩺","st":["Da li imate bolove?|У вас есть боли?|Скажите: у меня болит спина и колено|Bole me leđa i koleno|bolim leđa koleno|Bole me — множественное согласование с leđa.","Od kada imate problem?|С какого времени у вас проблема?|Скажите: уже неделю|Već nedelju dana|jedna nedelja sada|Длительность: nedelju dana — неделю.","Da li ste alergični na neki lek?|У вас аллергия на какие-нибудь лекарства?|Скажите: нет, насколько я знаю|Ne, koliko znam|ne znam lek alergija|Koliko znam — «насколько я знаю»."]},{"t":"Обсуждаем поездку с другом","c":"🧳","st":["Čime ćemo putovati?|На чём поедем?|Скажите: на поезде, потому что это удобнее|Putovaćemo vozom jer je udobnije|putujemo voz juče|Vozom — творительный падеж, средство передвижения.","Gde ćemo odsesti?|Где остановимся?|Скажите: у друзей, рядом с центром|Kod prijatelja, blizu centra|u prijatelji centar|Kod + родительный: kod prijatelja.","O čemu treba da se dogovorimo?|О чём нужно договориться?|Скажите: о времени отправления|O vremenu polaska|vreme polazak sutra|O + местный падеж: o vremenu."]}],"comics":[{"t":"Комикс: объясняем врачу симптомы","pn":[{"s":"🏥🩺","l":["B|Gde vas boli?|Где у вас болит?","A|Bole me leđa već nedelju dana.|У меня болит спина уже неделю."]},{"s":"📝💊","l":["B|Da li uzimate neke lekove?|Вы принимаете какие-нибудь лекарства?","A|Ne, ne uzimam ništa.|Нет, ничего не принимаю."]},{"s":"✅📅","l":["B|Uradićemo pregled i dogovoriti terapiju.|Мы проведём осмотр и согласуем лечение.","A|Hvala. Kada mogu da dobijem rezultate?|Спасибо. Когда я смогу получить результаты?"]}]},{"t":"Комикс: готовимся к совместной поездке","pn":[{"s":"🚆🗺️","l":["A|Čime ćemo putovati do Niša?|На чём поедем до Ниша?","M|Vozom. Tako ćemo izbeći gužvu.|На поезде. Так избежим пробок."]},{"s":"🏨📍","l":["A|Gde ćemo odsesti?|Где остановимся?","M|Kod prijatelja, blizu centra.|У друзей, недалеко от центра."]},{"s":"🕒🎫","l":["A|O vremenu polaska dogovorićemo se večeras.|О времени отправления договоримся сегодня вечером.","M|Važi. Kupiću karte čim potvrdimo plan.|Хорошо. Куплю билеты, как только подтвердим план."]}]}]},{"u":"b1-01","dialogs":[{"t":"Уточнить отсутствие документа и адресата","c":"👩‍💼","st":["Bez kog dokumenta ne možemo da završimo postupak?|Без какого документа мы не можем завершить процедуру?|Скажите: без подтверждения адреса|Bez potvrde o adresi|bez potvrda adresa|Bez + родительный падеж: potvrde.","Kome ste poslali zahtev?|Кому вы отправили запрос?|Скажите: директору отдела|Poslao sam ga direktoru odeljenja|poslao direktor odeljak|Дательный падеж адресата: direktoru odeljenja.","Da li ste dobili odgovor od koleginice?|Вы получили ответ от коллеги?|Ответьте: пока нет, жду его со вчерашнего дня|Još ne, čekam ga od juče|još ne, čekao sutra|Od juče — «со вчерашнего дня».","Kada ćemo obavestiti klijenta?|Когда уведомим клиента?|Скажите: как только получим недостающий документ|Čim dobijemo dokument koji nedostaje|čim dobili dokument|Čim вводит временную придаточную часть; dobijemo — настоящее в будущем значении."]}],"comics":[{"t":"Комикс: не хватает подтверждения","pn":[{"s":"📁🏢","l":["B|Postupak još nije završen.|Процедура ещё не завершена.","A|Šta nam nedostaje?|Чего нам не хватает?"]},{"s":"📄🔎","l":["B|Nedostaje potvrda o adresi.|Не хватает подтверждения адреса.","A|Poslaću zahtev koleginici koja vodi predmet.|Я отправлю запрос коллеге, которая ведёт дело."]},{"s":"📨✅","l":["B|Čim dokument stigne, obavestićemo klijenta.|Как только документ поступит, мы уведомим клиента.","A|Dogovoreno. Bez tog dokumenta ne možemo dalje.|Договорились. Без этого документа мы не можем двигаться дальше."]}]}]},{"u":"b1-02","dialogs":[{"t":"Обсудить маршрут и место встречи","c":"🧳","st":["Gde ćemo se naći pre polaska?|Где встретимся перед отправлением?|Предложите встретиться перед главным входом|Naći ćemo se ispred glavnog ulaza|u glavni ulaz mesto|Ispred + родительный падеж: glavnog ulaza.","Čime ćeš doći do stanice?|На чём ты приедешь на вокзал?|Ответьте: на служебной машине|Doći ću službenim automobilom|doći automobil sutra|Средство передвижения: творительный падеж automobilom.","Gde ćemo čekati ako pada kiša?|Где будем ждать, если идёт дождь?|Предложите подождать в зале ожидания|Sačekaćemo u čekaonici|čekati čekaonica sutra|Где? u + местный падеж: u čekaonici.","Možeš li da poneseš karte?|Можешь взять билеты с собой?|Скажите: конечно, положу их в сумку|Naravno, staviću ih u torbu|stavio sam torba|Куда? u + винительный: u torbu."]}],"comics":[{"t":"Комикс: встреча на вокзале","pn":[{"s":"🚉📍","l":["A|Naći ćemo se ispred glavnog ulaza.|Встретимся перед главным входом.","M|Dobro. Doći ću službenim automobilom.|Хорошо. Я приеду на служебной машине."]},{"s":"🌧️🪑","l":["A|Gde ćemo čekati ako bude padala kiša?|Где будем ждать, если пойдёт дождь?","M|U čekaonici, pored šaltera.|В зале ожидания, рядом с кассой."]},{"s":"🎫✅","l":["A|Karte sam stavila u torbu.|Я положила билеты в сумку.","M|Odlično. Onda možemo da krenemo.|Отлично. Тогда можем отправляться."]}]}]},{"u":"b1-03","dialogs":[{"t":"Описать процесс и завершённый результат","c":"💻","st":["Šta si radio dok sam bio na sastanku?|Что ты делал, пока я был на встрече?|Скажите: я проверял данные, а затем отправил отчёт|Proveravao sam podatke, a zatim sam poslao izveštaj|proverio podatke pa šaljem|Несовершенный вид — процесс; совершенный — завершённый результат.","Da li si završio proveru?|Ты закончил проверку?|Скажите: да, проверил все записи|Da, proverio sam sve zapise|proveravao sam sutra|Proverio sam — результат уже достигнут.","Zašto si ponovo otvorio fajl?|Почему ты снова открыл файл?|Скажите: я заметил ошибку и исправил её|Primetio sam grešku i ispravio je|primećujem greška sutra|Два завершённых события — совершенный вид.","Da li sada možemo da pošaljemo izveštaj?|Теперь можем отправить отчёт?|Ответьте: да, всё уже проверено|Da, sve je već provereno|da proveravamo još|Пассив здесь не обязателен; важно отметить завершённую проверку."]}],"comics":[{"t":"Комикс: ошибка в отчёте","pn":[{"s":"💻📊","l":["A|Dok sam proveravao podatke, primetio sam odstupanje.|Пока я проверял данные, я заметил отклонение.","M|Da li si odmah proverio izvor?|Ты сразу проверил источник?"]},{"s":"🔍🧾","l":["A|Jesam. Uporedio sam dve evidencije.|Да. Я сравнил две записи.","M|I šta si otkrio?|И что ты обнаружил?"]},{"s":"✅📨","l":["A|Pronašao sam grešku i ispravio je.|Я нашёл ошибку и исправил её.","M|Odlično. Sada možemo da pošaljemo izveštaj.|Отлично. Теперь можно отправлять отчёт."]}]}]},{"u":"b1-04","dialogs":[{"t":"Объяснить маршрут с приставочными глаголами","c":"🚌","st":["Kada si izašao iz kuće?|Когда ты вышел из дома?|Скажите: я вышел сразу после доручка|Izašao sam odmah posle doručka|ušao sam kuća|Izaći — выйти; iz + родительный падеж.","Da li si već stigao na stanicu?|Ты уже добрался до вокзала?|Ответьте: почти, я сейчас прелазим мост|Skoro, upravo prelazim most|prešao sam juče most|Prelazim — процесс движения; upravo — прямо сейчас.","Gde treba da skrenem?|Где мне нужно повернуть?|Скажите: поверните у следующего перекрёстка|Skrenite kod sledeće raskrsnice|skrenite sledeća raskrsnica|Kod + родительный: kod sledeće raskrsnice.","Da li ćeš stići na vreme?|Успеешь вовремя?|Ответьте: если автобус придёт, то да|Ako autobus stigne, stići ću na vreme|ako autobus stigao|После ako о будущем событии используется настоящее время."]}],"comics":[{"t":"Комикс: заблудились в городе","pn":[{"s":"🗺️🏙️","l":["A|Izašao sam na pogrešnoj stanici.|Я вышел не на той остановке.","M|Gde se sada nalaziš?|Где ты сейчас находишься?"]},{"s":"🚶‍♂️➡️","l":["A|Prelazim most i idem ka centru.|Я перехожу мост и иду к центру.","M|Kod sledećeg semafora skreni desno.|У следующего светофора поверни направо."]},{"s":"📍✅","l":["A|Stigao sam. Vidim glavni trg.|Я добрался. Вижу главную площадь.","M|Odlično, sačekaću te ispred kafića.|Отлично, подожду тебя перед кафе."]}]}]},{"u":"b1-05","dialogs":[{"t":"Восстановить последовательность событий","c":"👨","st":["Šta se dogodilo dok ste se vraćali?|Что произошло, пока вы возвращались?|Скажите: шёл дождь, когда мы встретили знакомых|Padala je kiša kada smo sreli poznanike|pada kiša sutra ljudi|Фон — padala je; событие — sreli smo.","Šta ste prvo uradili?|Что вы сделали сначала?|Скажите: сначала мы позвонили организатору|Prvo smo pozvali organizatora|prvo pozivamo juče|Prvo — сначала; pozvali smo — завершённое действие.","A šta je bilo zatim?|А что было потом?|Ответьте: затем мы нашли другой вход|Zatim smo pronašli drugi ulaz|zatim tražimo ulaz|Zatim — затем; pronašli smo — нашли.","Kako se priča završila?|Чем закончилась история?|Скажите: в итоге всё прошло хорошо|Na kraju je sve prošlo dobro|na kraju prolazi dobro|Na kraju — в итоге; прошло — prošlo je."]}],"comics":[{"t":"Комикс: неожиданная встреча","pn":[{"s":"🌧️🚶","l":["A|Dok sam se vraćao kući, počela je jaka kiša.|Когда я возвращался домой, начался сильный дождь.","M|I šta si onda uradio?|И что ты тогда сделал?"]},{"s":"🏪👋","l":["A|Ušao sam u malu prodavnicu da sačekam.|Я зашёл в небольшой магазин, чтобы подождать.","M|Tamo si nekoga sreo?|Ты там кого-то встретил?"]},{"s":"😊☕","l":["A|Da, sreo sam starog prijatelja i otišli smo na kafu.|Да, встретил старого друга, и мы пошли пить кофе.","M|Lep način da se završi kišni dan!|Хороший способ закончить дождливый день!"]}]}]},{"u":"b1-06","dialogs":[{"t":"Сравнить прошлый опыт и результат","c":"📚","st":["Koliko dugo si učio srpski pre nego što si došao?|Как долго ты учил сербский до приезда?|Скажите: я учил его около года|Učio sam ga oko godinu dana|učio ga sutra|Длительность процесса: несовершенный вид učio sam.","Da li si položio prvi test?|Ты сдал первый тест?|Ответьте: да, сдал его в июне|Da, položio sam ga u junu|polagao sam ga sutra|Položio sam — результат, успешно сдал.","Šta ti je najviše pomoglo?|Что тебе больше всего помогло?|Скажите: регулярная практика с носителями|Najviše mi je pomogla redovna praksa sa izvornim govornicima|pomoć juče redovno|Pomogla — прошедшее время согласуется с praksa (жен. род).","Da li nastavljaš da vežbaš?|Ты продолжаешь заниматься?|Скажите: да, стараюсь каждый день|Da, trudim se svakog dana|trudio sam svaki dan juče|Trudim se — настоящее время возвратного глагола."]}],"comics":[{"t":"Комикс: путь к языковому экзамену","pn":[{"s":"📖🕰️","l":["A|Učio sam srpski godinu dana pre ispita.|Я учил сербский год до экзамена.","M|Da li si mnogo vežbao?|Ты много практиковался?"]},{"s":"🗣️👥","l":["A|Svakog vikenda razgovarao sam sa prijateljima iz Srbije.|Каждые выходные я разговаривал с друзьями из Сербии.","M|To ti je sigurno mnogo pomoglo.|Это тебе наверняка очень помогло."]},{"s":"🎓✅","l":["A|Položio sam ispit prošlog meseca.|Я сдал экзамен в прошлом месяце.","M|Čestitam! Sada nastavi da koristiš jezik.|Поздравляю! Теперь продолжай использовать язык."]}]}]},{"u":"b1-07","dialogs":[{"t":"Обсудить реальное условие","c":"🏞️","st":["Šta ćemo raditi ako vreme bude lepo?|Что будем делать, если погода будет хорошей?|Скажите: поедем за город|Otići ćemo van grada|otišli smo juče|Реальное условие о будущем: если будет…, сделаем…","A ako bude padala kiša?|А если будет идти дождь?|Ответьте: останемся дома и приготовим ужин|Ostaćemo kod kuće i spremiti večeru|ostali smo juče|Будущее следствие: ostaćemo, spremićemo.","Kada budeš znao prognozu, javi mi.|Когда будешь знать прогноз, сообщи мне.|Скажите: сообщу сразу, как только узнаю|Javiću ti čim budem znao|javim juče znam|Futur II в придаточной части времени: budem znao.","Da li da rezervišem sto?|Забронировать столик?|Скажите: да, на всякий случай|Da, za svaki slučaj|da slučaj svaki bio|Za svaki slučaj — на всякий случай."]}],"comics":[{"t":"Комикс: поездка зависит от погоды","pn":[{"s":"🌤️📱","l":["A|Ako bude sunčano, otići ćemo na Frušku goru.|Если будет солнечно, поедем на Фрушку-Гору.","M|A ako bude padala kiša?|А если будет идти дождь?"]},{"s":"🌧️🏡","l":["A|Ostaćemo kod kuće i napravićemo ručak.|Останемся дома и приготовим обед.","M|Kada ćemo odlučiti?|Когда решим?"]},{"s":"📲✅","l":["A|Čim budem video prognozu, javiću ti.|Как только увижу прогноз, сообщу тебе.","M|Odlično. Onda čekam tvoju poruku.|Отлично. Тогда жду твоего сообщения."]}]}]},{"u":"b1-08","dialogs":[{"t":"Предложить альтернативный план","c":"🧑‍🤝‍🧑","st":["Da li još važi naš dogovor za subotu?|Наша договорённость на субботу ещё в силе?|Скажите: да, если ничего не изменится|Da, ako se ništa ne promeni|da promenilo juče|Если ничего не изменится: ako se ništa ne promeni.","Šta ćemo ako restoran bude zatvoren?|Что будем делать, если ресторан будет закрыт?|Предложите пойти в другое место|Možemo da odemo na drugo mesto|otišli smo drugo|Možemo da… — можем; odemo — совершенный вид после modalnog glagola.","Kada treba da rezervišemo?|Когда нужно забронировать?|Скажите: как можно скорее|Što pre|što brzo juče|Što pre — как можно скорее.","Hoćeš li ti da pozoveš?|Ты позвонишь?|Ответьте: да, позвоню сейчас|Da, pozvaću odmah|pozvao sam juče|Pozvaću — будущее время."]}],"comics":[{"t":"Комикс: меняем план на выходные","pn":[{"s":"📱🌧️","l":["A|Izlet možda neće biti moguć ako padne kiša.|Поездка, возможно, не состоится, если пойдёт дождь.","M|Šta predlažeš umesto toga?|Что предлагаешь вместо этого?"]},{"s":"🎬🍽️","l":["A|Možemo da odemo u muzej, a zatim na večeru.|Можем сходить в музей, а затем на ужин.","M|Dobra ideja. Da li treba da rezervišemo?|Хорошая идея. Нужно бронировать?"]},{"s":"☎️✅","l":["A|Pozvaću restoran čim završim posao.|Я позвоню в ресторан, как только закончу работу.","M|Odlično, onda imamo plan B.|Отлично, значит, у нас есть план Б."]}]}]},{"u":"b1-09","dialogs":[{"t":"Уточнить информацию по телефону","c":"☎️","st":["Dobar dan. Da li biste mogli da mi kažete kada se gospodin vraća?|Добрый день. Не могли бы вы сказать, когда господин вернётся?|Скажите: он вернётся после совещания|Vratiće se nakon sastanka|vratio se pre sastanka|После просьбы идёт косвенный вопрос с обычным порядком слов.","Želite li da mu prenesem poruku?|Хотите, чтобы я передал ему сообщение?|Попросите сообщить, что вы звонили по поводу договора|Recite mu da sam zvao u vezi sa ugovorom|reci da zovem ugovor|Косвенная передача: recite mu da sam zvao…","Da li želite da vas pozove danas?|Хотите, чтобы он позвонил вам сегодня?|Ответьте: буду признателен, если он позвонит до пяти|Bio bih zahvalan ako bi pozvao do pet|hvala pozvao juče|Условная форма смягчает просьбу: bio bih zahvalan.","Mogu li da zabeležim vaš broj?|Могу записать ваш номер?|Скажите: конечно, продиктую ещё раз|Naravno, ponoviću ga još jednom|ponovio sam juče|Ponoviću — будущее время."]}],"comics":[{"t":"Комикс: важный звонок в офис","pn":[{"s":"☎️🏢","l":["A|Dobar dan. Zovem u vezi sa ugovorom.|Добрый день. Звоню по поводу договора.","S|Kolega je trenutno na sastanku.|Коллега сейчас на совещании."]},{"s":"🕒📝","l":["A|Da li biste mogli da mi kažete kada će se vratiti?|Не могли бы вы сказать, когда он вернётся?","S|Verovatno nakon dva sata.|Вероятно, через два часа."]},{"s":"📞✅","l":["A|Molim vas, prenesite mu da sam zvao.|Пожалуйста, передайте ему, что я звонил.","S|Naravno. Da li želite da vas pozove?|Конечно. Хотите, чтобы он вам позвонил?"]}]}]},{"u":"b1-10","dialogs":[{"t":"Смягчить просьбу и уточнить детали","c":"📞","st":["Da li biste mogli da mi pošaljete potvrdu?|Не могли бы вы отправить мне подтверждение?|Скажите: буду благодарен, если отправите сегодня|Bio bih zahvalan ako biste poslali danas|zahvalan šalji juče|Условная форма делает просьбу вежливой.","Kada vam potvrda najviše odgovara?|Когда вам удобнее получить подтверждение?|Ответьте: до конца рабочего дня|Do kraja radnog dana|kraj radni dan juče|Do + родительный падеж: do kraja dana.","Da li vam je potreban i original?|Вам нужен и оригинал?|Скажите: пока достаточно электронной копии|Za sada je dovoljna elektronska kopija|sad original nije|Za sada — пока; достаточный: dovoljna (копия).","Hvala na razumevanju.|Спасибо за понимание.|Ответьте: не за что, рад помочь|Nema na čemu, drago mi je da mogu da pomognem|ne hvala rad|Drago mi je da… — рад, что могу…"]}],"comics":[{"t":"Комикс: просим прислать подтверждение","pn":[{"s":"📩📄","l":["A|Da li biste mogli da mi pošaljete potvrdu danas?|Не могли бы вы отправить мне подтверждение сегодня?","S|Mogu, ali prvo moram da proverim podatke.|Могу, но сначала должен проверить данные."]},{"s":"🕓🔎","l":["A|Bio bih zahvalan ako biste to završili do kraja dana.|Буду благодарен, если вы закончите это до конца дня.","S|Pokušaću da pošaljem potvrdu pre pet.|Постараюсь отправить подтверждение до пяти."]},{"s":"🤝✅","l":["A|To mi odgovara. Hvala na pomoći.|Меня это устраивает. Спасибо за помощь.","S|Nema na čemu. Javiću vam kada bude poslato.|Не за что. Сообщу вам, когда отправлю."]}]}]},{"u":"b1-11","dialogs":[{"t":"Сообщить о расхождении в выписке","c":"🏦","st":["Na izvodu se pojavljuje iznos koji ne prepoznajem.|В выписке появилась сумма, которую я не узнаю.|Скажите: я хотел бы подать запрос на проверку|Želeo bih da podnesem zahtev za proveru|želim podneo zahtev juče|Želeo bih — вежливая просьба; podneti zahtev — подать запрос.","Imate li dokaz o uplati?|У вас есть подтверждение платежа?|Скажите: могу предоставить банковскую выписку|Mogu da dostavim bankovni izvod|mogu dostavio izvod|Mogu da + настоящее время: dostavim.","Da li ste već kontaktirali trgovca?|Вы уже связывались с продавцом?|Ответьте: да, но ответа пока нет|Jesam, ali još nisam dobio odgovor|jesam, dobio juče odgovor|Jesam — краткий утвердительный ответ на вопрос с li.","Kada mogu da očekujem povratnu informaciju?|Когда могу ожидать обратную связь?|Скажите: желательно до пятницы|Po mogućstvu do petka|petak posle juče|Po mogućstvu — по возможности."]}],"comics":[{"t":"Комикс: спорная операция","pn":[{"s":"🏦💳","l":["A|Na izvodu sam primetio transakciju koju ne prepoznajem.|В выписке я заметил операцию, которую не узнаю.","B|Da li ste kontaktirali trgovca?|Вы связывались с продавцом?"]},{"s":"📄🔎","l":["A|Jesam, ali još nisam dobio odgovor.|Да, но ответа пока не получил.","B|Možete podneti zahtev i priložiti izvod.|Вы можете подать запрос и приложить выписку."]},{"s":"📝✅","l":["A|U redu. Želeo bih povratnu informaciju do petka.|Хорошо. Я хотел бы получить обратную связь до пятницы.","B|Zabeležićemo vaš zahtev i obavestiti vas.|Мы зарегистрируем ваш запрос и уведомим вас."]}]}]},{"u":"b1-12","dialogs":[{"t":"Обсудить срок ответа и следующий шаг","c":"🏦","st":["Da li je zahtev već prosleđen nadležnom timu?|Запрос уже передан ответственному отделу?|Ответьте: да, отправили его вчера|Da, prosledili smo ga juče|da prosleđujemo sutra|Prosledili smo — совершенный вид, завершённое действие.","Šta još nedostaje?|Чего ещё не хватает?|Скажите: нужно приложить копию договора|Treba priložiti kopiju ugovora|treba kopija ugovor juče|Treba + инфинитив или da-конструкция.","Možete li da ubrzate proveru?|Можете ускорить проверку?|Скажите: постараемся, но нужен полный комплект|Pokušaćemo, ali potrebna je kompletna dokumentacija|pokušavali juče papir|Потребна: potrebna je; согласуется с документација.","Kada ćete me obavestiti?|Когда вы меня уведомите?|Ответьте: как только проверка будет завершена|Čim provera bude završena|čim završila juče|Futur II в придаточной части: bude završena."]}],"comics":[{"t":"Комикс: запрос передан в отдел проверки","pn":[{"s":"🗂️🏦","l":["A|Da li je moj zahtev prosleđen timu za proveru?|Мой запрос передан в отдел проверки?","B|Jeste, prosledili smo ga juče.|Да, мы передали его вчера."]},{"s":"📎🔍","l":["A|Da li je potrebna još neka dokumentacija?|Нужны ещё какие-нибудь документы?","B|Potrebna je kopija ugovora.|Нужна копия договора."]},{"s":"📬✅","l":["A|Dostaviću je danas. Kada mogu da očekujem odgovor?|Предоставлю её сегодня. Когда ожидать ответ?","B|Obavestićemo vas čim provera bude završena.|Уведомим вас, как только проверка завершится."]}]}]},{"u":"b2-01","dialogs":[{"t":"Разобрать причины срыва срока","c":"💼","st":["Zašto izveštaj nije dostavljen u predviđenom roku?|Почему отчёт не был предоставлен в установленный срок?|Скажите: проверка данных заняла больше времени, чем предполагалось|Provera podataka trajala je duže nego što je bilo predviđeno|provera traje sutra|Сложное сравнение: duže nego što… — дольше, чем…","Da li je kašnjenje moglo biti sprečeno?|Можно ли было предотвратить задержку?|Ответьте: при более раннем согласовании, вероятно, да|Uz ranije usaglašavanje, verovatno jeste|ako ranije usaglasimo|Uz + творительный падеж: uz ranije usaglašavanje.","Šta predlažete za ubuduće?|Что вы предлагаете на будущее?|Предложите ввести промежуточные контрольные точки|Predlažem da uvedemo kontrolne tačke tokom procesa|predlog uvodimo juče|Predlažem da + настоящее время.","Kako ćemo proceniti da li mera funkcioniše?|Как оценим, работает ли мера?|Скажите: сравним сроки до и после её внедрения|Uporedićemo rokove pre i nakon njenog uvođenja|uporediti rokovi bez|Номинальная форма uvođenja после предлога nakon."]}],"comics":[{"t":"Комикс: разбор проваленного дедлайна","pn":[{"s":"📊⏰","l":["M|Izveštaj nije dostavljen u predviđenom roku.|Отчёт не был предоставлен в установленный срок.","A|Provera podataka trajala je duže nego što smo očekivali.|Проверка данных заняла больше времени, чем мы ожидали."]},{"s":"🔍🧩","l":["M|Da li je problem mogao biti sprečen?|Можно ли было предотвратить проблему?","A|Uz ranije usaglašavanje, verovatno bismo izbegli kašnjenje.|При более раннем согласовании мы, вероятно, избежали бы задержки."]},{"s":"📝✅","l":["M|Šta ćemo promeniti?|Что изменим?","A|Uvešćemo kontrolne tačke tokom procesa i jasniju odgovornost.|Введём промежуточные контрольные точки и более ясную ответственность."]}]}]},{"u":"b2-02","dialogs":[{"t":"Обсудить альтернативный сценарий","c":"🧑‍💼","st":["Šta bi se dogodilo da je kontrola sprovedena ranije?|Что произошло бы, если бы проверку провели раньше?|Ответьте: ошибка би била уочена пре слања|Greška bi bila uočena pre slanja|greška je uočena sutra|Пассив + кондиционал: bi bila uočena.","Da li bismo time izbegli dodatne troškove?|Избежали бы мы этим дополнительных расходов?|Скажите: вероятно, но не все расходы|Verovatno bismo, ali ne sve troškove|sigurno izbegli svi|Verovatno смягчает степень уверенности.","Koji zaključak možemo izvući?|Какой вывод можем сделать?|Скажите: контроль необходимо встроить в процесс|Možemo zaključiti da kontrolu treba ugraditi u proces|zaključujemo kontrola gotovo|Da + настоящее время в придаточном выводе.","Kako ćete to dokumentovati?|Как вы это задокументируете?|Ответьте: в новой версии процедуры|U novoj verziji procedure|nova procedura juče|U + местный падеж: u verziji procedure."]}],"comics":[{"t":"Комикс: что было бы при ранней проверке","pn":[{"s":"📉🔎","l":["A|Da je kontrola sprovedena ranije, greška bi bila uočena.|Если бы проверку провели раньше, ошибка была бы замечена.","M|Da li bismo izbegli kašnjenje?|Избежали бы мы задержки?"]},{"s":"🧮📊","l":["A|Verovatno bismo izbegli deo dodatnih troškova.|Вероятно, мы избежали бы части дополнительных расходов.","M|Šta ipak ostaje otvoreno?|Что всё же остаётся открытым?"]},{"s":"📝✅","l":["A|Potrebno je da kontrolu ugradimo u redovan proces.|Необходимо встроить проверку в регулярный процесс.","M|Slažem se. To ćemo navesti u novoj proceduri.|Согласен. Укажем это в новой процедуре."]}]}]},{"u":"b2-03","dialogs":[{"t":"Проверить статус договора","c":"📑","st":["Da li je ugovor potpisan sa obe strane?|Договор подписан обеими сторонами?|Ответьте: нашей стороной — да, партнёром — ещё нет|Naša strana ga je potpisala, partner još nije|potpisuje obe strana|Объектное местоимение ga занимает раннюю позицию в предложении.","Zbog čega postupak još nije okončan?|Почему процедура ещё не завершена?|Передайте: юридический отдел запросил дополнительное pojašnjenje|Pravna služba je zatražila dodatno pojašnjenje|pravna traži juče|Zatražila je — прошедшее время, субъект женского рода služba.","Kada se očekuje konačna verzija?|Когда ожидается окончательная версия?|Скажите: после того, как замечания будут устранены|Nakon što primedbe budu otklonjene|nakon primedbe otklanjaju|Пассив в придаточной части: budu otklonjene.","Možemo li u međuvremenu pripremiti priloge?|Можем пока подготовить приложения?|Ответьте: да, это не зависит от окончательного текста|Da, to ne zavisi od konačnog teksta|da zavisi tekst završio|Ne zavisi od + родительный падеж."]}],"comics":[{"t":"Комикс: договор на согласовании","pn":[{"s":"📑🏢","l":["A|Naša strana je potpisala ugovor.|Наша сторона подписала договор.","M|Da li ga je potpisao i partner?|Партнёр тоже его подписал?"]},{"s":"⚖️📨","l":["A|Još nije. Pravna služba je zatražila dodatno pojašnjenje.|Пока нет. Юридический отдел запросил дополнительное разъяснение.","M|Kada će konačna verzija biti spremna?|Когда будет готова окончательная версия?"]},{"s":"🖊️✅","l":["A|Nakon što primedbe budu otklonjene, poslaćemo je partneru.|После устранения замечаний мы отправим её партнёру.","M|U međuvremenu možemo pripremiti priloge.|Тем временем мы можем подготовить приложения."]}]}]},{"u":"b2-04","dialogs":[{"t":"Передать содержание юридического ответа","c":"📞","st":["Šta je pravna služba odgovorila?|Что ответил юридический отдел?|Передайте: они сказали, что необходимо изменить один пункт|Rekli su da je potrebno izmeniti jednu odredbu|rekli da promena jedan|Косвенная речь вводится союзом da.","Da li su naveli razlog?|Они назвали причину?|Скажите: по их мнению, формулировка неоднозначна|Prema njihovom mišljenju, formulacija je dvosmislena|oni misle formulacija dobro|Prema + дательный падеж: njihovom mišljenju.","Šta su predložili?|Что они предложили?|Ответьте: заменить термин и уточнить срок|Predložili su da zamenimo termin i preciziramo rok|predlažu zameniti juče|Predložili su da + настоящее время.","Kada ćemo im poslati izmenjenu verziju?|Когда отправим им изменённую версию?|Скажите: после того, как директор её одобрит|Nakon što je direktor odobri|nakon direktor odobrio|После временного союза — настоящее время с будущим значением."]}],"comics":[{"t":"Комикс: передаём заключение юристов","pn":[{"s":"⚖️📄","l":["A|Pravna služba je pregledala ugovor.|Юридический отдел проверил договор.","M|Šta su zaključili?|К какому выводу они пришли?"]},{"s":"📝💬","l":["A|Rekli su da je jedna odredba nejasna.|Они сказали, что одно положение неясно.","M|Da li su predložili izmenu?|Они предложили изменение?"]},{"s":"✅📨","l":["A|Predložili su da preciziramo rok i zamenimo termin.|Они предложили уточнить срок и заменить термин.","M|Pošaljimo novu verziju nakon odobrenja direktora.|Отправим новую версию после одобрения директора."]}]}]},{"u":"b2-05","dialogs":[{"t":"Уточнить получение документов","c":"📧","st":["Da li ste primili dokumentaciju koju smo vam prosledili?|Вы получили документы, которые мы вам переслали?|Ответьте: да, коллега, которому они были отправлены, подтвердил получение|Da, kolega kojem je poslata potvrdio je prijem|da kolega poslao primio|Местоимение kojem определяется ролью в придаточной части.","Da li nedostaje neki prilog?|Какого-нибудь приложения не хватает?|Скажите: не хватает приложения, на котором стоит печать|Nedostaje prilog na kojem se nalazi pečat|nedostaje pečat koji|Na kojem — местный падеж относительного местоимения.","Kada ćete ga dostaviti?|Когда вы его предоставите?|Ответьте: сразу после того, как его получим от партнёра|Čim ga dobijemo od partnera|čim dobili partner|Clitic ga размещается перед глаголом dobijemo.","Da li je ostalo još nešto?|Осталось что-нибудь ещё?|Скажите: насколько я вижу, комплект полный|Koliko vidim, dokumentacija je potpuna|vidim dokument nepotpun|Koliko vidim — насколько я вижу."]}],"comics":[{"t":"Комикс: не хватает одного приложения","pn":[{"s":"📧📂","l":["A|Primili smo dokumentaciju koju ste poslali.|Мы получили документы, которые вы отправили.","M|Da li je sve kompletno?|Всё ли в комплекте?"]},{"s":"🔎📎","l":["A|Nedostaje prilog na kojem treba da bude pečat.|Не хватает приложения, на котором должна быть печать.","M|Poslaćemo ga čim ga dobijemo od partnera.|Отправим его, как только получим от партнёра."]},{"s":"✅📨","l":["A|U redu. Javite nam čim dokumentacija bude potpuna.|Хорошо. Сообщите, как только документы будут полными.","M|Naravno, obavestićemo vas.|Конечно, мы вас уведомим."]}]}]},{"u":"b2-06","dialogs":[{"t":"Обсудить распределение обязанностей","c":"🧑‍💼","st":["Kome je poverena završna provera?|Кому поручена итоговая проверка?|Ответьте: специалисту, с которым мы уже работали|Stručnjaku sa kojim smo već sarađivali|stručnjak koji radili|Sa kojim — творительный падеж после sa.","Da li je jasno ko odobrava konačnu verziju?|Понятно, кто утверждает окончательную версию?|Скажите: это руководитель, которому передали проект|To je rukovodilac kojem je projekat poveren|rukovodilac koji projekat|Koji/kojem зависит от синтаксической функции местоимения.","Šta ćemo uraditi ako ne odgovori do sutra?|Что сделаем, если он не ответит до завтра?|Предложите связаться с его заместителем|Kontaktiraćemo njegovu zamenicu|kontaktirali juče|Будущее время: kontaktiraćemo.","Da li treba sve zabeležiti?|Нужно ли всё зафиксировать?|Ответьте: да, чтобы не возникло недоразумений|Da, kako ne bi došlo do nesporazuma|da kako nije došlo|Kako ne bi — чтобы не произошло; условная форма."]}],"comics":[{"t":"Комикс: распределяем ответственность","pn":[{"s":"👥📋","l":["A|Završna provera poverena je stručnjaku sa kojim smo ranije sarađivali.|Итоговая проверка поручена специалисту, с которым мы раньше сотрудничали.","M|Ko odobrava konačnu verziju?|Кто утверждает окончательную версию?"]},{"s":"🧑‍💼🖊️","l":["A|Rukovodilac kojem je projekat poveren.|Руководитель, которому поручен проект.","M|A ako ne odgovori do sutra?|А если он не ответит до завтра?"]},{"s":"📞✅","l":["A|Kontaktiraćemo njegovu zamenicu kako ne bi došlo do kašnjenja.|Свяжемся с его заместительницей, чтобы не возникла задержка.","M|Važno je da sve bude zabeleženo.|Важно, чтобы всё было зафиксировано."]}]}]},{"u":"b2-07","dialogs":[{"t":"Выразить несогласие дипломатично","c":"🏢","st":["Da li podržavate predloženi budžet?|Вы поддерживаете предложенный бюджет?|Скажите: в целом да, однако некоторые расходы требуют обоснования|U načelu da, međutim pojedine troškove treba dodatno obrazložiti|da svi trošak odbiti|U načelu — в принципе; međutim — однако.","Šta smatrate najvećim rizikom?|Что вы считаете главным риском?|Ответьте: недостаточная оценка долгосрочных затрат|Nedovoljna procena dugoročnih troškova|rizik nije cena|Именная группа: nedovoljna procena.","Kako bismo mogli da ublažimo taj rizik?|Как мы могли бы смягчить этот риск?|Предложите провести независимую оценку|Mogli bismo da sprovedemo nezavisnu procenu|mogli smo procena|Кондиционал bismo смягчает предложение.","Da li biste podržali izmenjeni predlog?|Поддержали бы вы изменённое предложение?|Скажите: после уточнения допущений — да|Nakon što pretpostavke budu precizirane, da|nakon pretpostavke precizirati|Futur II в придаточной части: budu precizirane."]}],"comics":[{"t":"Комикс: несогласие на совещании","pn":[{"s":"🏢📊","l":["M|Da li podržavate predloženi budžet?|Вы поддерживаете предложенный бюджет?","A|U načelu da, međutim neke stavke zahtevaju dodatno obrazloženje.|В принципе да, однако некоторые статьи требуют дополнительного обоснования."]},{"s":"🧮💬","l":["M|Koji rizik smatrate najvažnijim?|Какой риск вы считаете наиболее важным?","A|Nedovoljna procena dugoročnih troškova.|Недостаточная оценка долгосрочных затрат."]},{"s":"🤝✅","l":["M|Kako možemo da ga ublažimo?|Как можем его смягчить?","A|Nezavisnom procenom i jasnijim pretpostavkama.|Независимой оценкой и более ясными предположениями."]}]}]},{"u":"b2-08","dialogs":[{"t":"Структурировать обсуждение","c":"📝","st":["Koji je cilj današnjeg sastanka?|Какова цель сегодняшнего совещания?|Скажите: рассмотрение вариантов финансирования|Cilj je razmatranje mogućnosti finansiranja|cilj razmatramo novac|Номинализация razmatranje делает формулировку официальной.","Šta bi trebalo prvo razmotriti?|Что следовало бы рассмотреть в первую очередь?|Ответьте: правовые ограничения и сроки реализации|Pravne prepreke i rokove realizacije|pravno prepreka radi|Imenska grupa: pravne prepreke; rokove реализации.","Kako ćemo predstaviti zaključke?|Как представим выводы?|Скажите: в кратком резюме, с указанием ограничений|U kratkom sažetku, uz navođenje ograničenja|kratko zaključak bez|Uz + творительный падеж: uz navođenje.","Ko će pripremiti završni dokument?|Кто подготовит итоговый документ?|Ответьте: команда, ответственная за проект|Tim zadužen za projekat|tim odgovoran projekat|Zadužen za — отвечающий за, устойчивое сочетание."]}],"comics":[{"t":"Комикс: повестка совещания","pn":[{"s":"🗂️🏢","l":["M|Cilj sastanka je razmatranje mogućnosti finansiranja.|Цель встречи — рассмотрение вариантов финансирования.","A|Predlažem da prvo razmotrimo pravne prepreke.|Предлагаю сначала рассмотреть правовые ограничения."]},{"s":"📅⚖️","l":["M|Zatim bi trebalo usaglasiti rokove realizacije.|Затем следовало бы согласовать сроки реализации.","A|Slažem se, uz navođenje svih pretpostavki.|Согласен, с указанием всех предположений."]},{"s":"📄✅","l":["M|Ko će pripremiti završni sažetak?|Кто подготовит итоговое резюме?","A|Tim zadužen za projekat dostaviće ga do petka.|Команда, отвечающая за проект, предоставит его к пятнице."]}]}]},{"u":"b2-09","dialogs":[{"t":"Выразить степень уверенности","c":"📈","st":["Da li možemo tvrditi da je trend trajan?|Можем ли мы утверждать, что тенденция устойчива?|Скажите: имеющихся данных пока недостаточно для такого вывода|Dostupni podaci za sada nisu dovoljni za takav zaključak|sigurno trend traje|Za sada — на данный момент; nisu dovoljni — недостаточны.","Šta bi dodatno povećalo pouzdanost analize?|Что повысило бы надёжность анализа?|Ответьте: более широкая выборка и независимый источник|Širi uzorak i nezavisan izvor|uzorak mali isti|Сравнительная форма širi — более широкий.","Da li je drugi uzrok isključen?|Другую причину исключили?|Скажите: нет, это нельзя исключить полностью|Ne, to se ne može u potpunosti isključiti|ne, ne isključuje juče|Пассивно-безличная форма ne može se isključiti.","Kako bismo formulisali zaključak?|Как сформулируем вывод?|Скажите: результаты указывают на связь, но не доказывают причинность|Rezultati ukazuju na povezanost, ali ne dokazuju uzročnost|rezultati dokazuju sve|Ukazivati na — указывать на; dokazivati — доказывать."]}],"comics":[{"t":"Комикс: осторожный вывод по данным","pn":[{"s":"📊🔬","l":["A|Rezultati ukazuju na povezanost između dve pojave.|Результаты указывают на связь между двумя явлениями.","M|Da li to dokazuje uzročnost?|Доказывает ли это причинность?"]},{"s":"🧪📚","l":["A|Ne nužno. Uzorak je ograničen, a moguć je i drugi uzrok.|Не обязательно. Выборка ограничена, возможна и другая причина.","M|Šta bi povećalo pouzdanost?|Что повысило бы надёжность?"]},{"s":"📝✅","l":["A|Dodatni podaci i nezavisan izvor.|Дополнительные данные и независимый источник.","M|Onda zaključak treba formulisati oprezno.|Тогда вывод следует сформулировать осторожно."]}]}]},{"u":"b2-10","dialogs":[{"t":"Собрать аргумент с оговоркой","c":"📚","st":["Na čemu zasnivate ovaj zaključak?|На чём вы основываете этот вывод?|Ответьте: на двух независимых источниках и сравнении периодов|Na dva nezavisna izvora i poređenju perioda|na dva izvor i period|Na + местный падеж; poređenje — сравнение.","Koje ograničenje treba pomenuti?|Какое ограничение следует упомянуть?|Скажите: выборка не охватывает все группы клиентов|Uzorak ne obuhvata sve grupe klijenata|uzorak svi podaci|Obuhvatati — охватывать; отрицание ne obuhvata.","Kako to utiče na konačnu procenu?|Как это влияет на итоговую оценку?|Ответьте: снижает уверенность, но не отменяет тенденцию|Smanjuje sigurnost, ali ne poništava trend|sigurnost potpuno poništava|Smanjuje — уменьшает; poništava — отменяет.","Koja formulacija bi bila najpreciznija?|Какая формулировка была бы наиболее точной?|Скажите: данные свидетельствуют о вероятной связи|Podaci ukazuju na verovatnu povezanost|podaci sigurno dokaz|Ukazivati na — указывать на, осторожнее чем dokazati."]}],"comics":[{"t":"Комикс: формулируем аналитический вывод","pn":[{"s":"📈📄","l":["M|Na čemu zasnivamo zaključak?|На чём основываем вывод?","A|Na dva nezavisna izvora i poređenju više perioda.|На двух независимых источниках и сравнении нескольких периодов."]},{"s":"🔍⚠️","l":["M|Koje ograničenje moramo navesti?|Какое ограничение должны указать?","A|Uzorak ne obuhvata sve grupe klijenata.|Выборка не охватывает все группы клиентов."]},{"s":"✅🧠","l":["M|Kako ćemo formulisati rezultat?|Как сформулируем результат?","A|Podaci ukazuju na verovatnu povezanost, ali ne dokazuju uzročnost.|Данные указывают на вероятную связь, но не доказывают причинность."]}]}]},{"u":"b2-11","dialogs":[{"t":"Составить официальное обращение","c":"📧","st":["Povodom čega nam se obraćate?|По какому вопросу вы к нам обращаетесь?|Скажите: по поводу отклонения запроса|Obraćam vam se povodom odbijanja zahteva|obraćam zbog zahtev odbio|Povodom + родительный падеж: odbijanja zahteva.","Koju informaciju očekujete od nas?|Какую информацию вы от нас ожидаете?|Попросите разъяснить основание принятого решения|Ljubazno vas molim da pojasnite osnov donete odluke|molim pojasni odluka|Ljubazno vas molim da… — формальная просьба.","Da li želite da priložite dodatnu dokumentaciju?|Хотите приложить дополнительные документы?|Ответьте: все подтверждающие материалы прилагаются к письму|Sva prateća dokumentacija dostavlja se u prilogu|dokumentacija šaljem sutra|Пассив dostavlja se — направляется, официальный стиль.","Kada očekujete odgovor?|Когда ожидаете ответ?|Скажите: желательно в течение пяти рабочих дней|Po mogućstvu u roku od pet radnih dana|pet radni dan bez roka|U roku od + родительный падеж."]}],"comics":[{"t":"Комикс: официальное обращение","pn":[{"s":"📩🏢","l":["S|Primili smo vaš zahtev za dodatno pojašnjenje.|Мы получили ваш запрос о дополнительном разъяснении.","A|Obraćam vam se povodom odbijanja prethodnog zahteva.|Обращаюсь к вам по поводу отклонения предыдущего запроса."]},{"s":"📎📝","l":["S|Molimo vas da navedete šta smatrate spornim.|Просим вас указать, что вы считаете спорным.","A|U prilogu dostavljam dokumentaciju koja potvrđuje navedene činjenice.|В приложении направляю документы, подтверждающие указанные факты."]},{"s":"📬✅","l":["S|Predmet će biti ponovo razmotren.|Вопрос будет рассмотрен повторно.","A|Zahvaljujem. Očekujem odgovor u roku od pet radnih dana.|Благодарю. Ожидаю ответ в течение пяти рабочих дней."]}]}]},{"u":"b2-12","dialogs":[{"t":"Выбрать естественное устойчивое выражение","c":"🗣️","st":["Kako biste opisali način na koji tim vodi računa o detaljima?|Как бы вы описали то, как команда учитывает детали?|Скажите: команда внимательно относится к деталям|Tim posvećuje posebnu pažnju detaljima|tim gleda detalji|Posvećivati pažnju + дательный падеж: detaljima.","Da li ste stupili u kontakt sa partnerima?|Вы вступили в контакт с партнёрами?|Ответьте: да, после встречи мы связались с ними|Da, nakon sastanka smo stupili u kontakt s njima|da kontaktirali oni juče|Stupiti u kontakt — устойчивое сочетание.","Do kakvog ste zaključka došli?|К какому выводу вы пришли?|Скажите: мы пришли к общему решению|Došli smo do zajedničkog zaključka|došli zaključak sam|Doći do + родительный падеж: do zaključka.","Kako biste to rekli manje formalno?|Как бы вы сказали это менее формально?|Скажите: мы договорились и можем начать|Dogovorili smo se i možemo da počnemo|dogovorimo početak juče|Dogovorili smo se — договорились; возвратная форма."]}],"comics":[{"t":"Комикс: обсуждение естественных выражений","pn":[{"s":"🤝💬","l":["M|Da li ste stupili u kontakt sa novim partnerima?|Вы связались с новыми партнёрами function cloze(c){
  const lines=c.pn.flatMap(p=>p.l.map(x=>x.split("|"))),bank=[...new Set(CM.flatMap(k=>k.pn.flatMap(p=>p.l.flatMap(x=>x.split("|")[1].split(" ").map(w=>w.replace(/[.?!,]/g,""))))))].filter(w=>w.length>2);

    if(n>=Q.length){const ok=sc>=4,flag=Q.length-sc>Q.length/2;if(ok)S.c[c.id]=1;if(flag)S.rv["c:"+c.id]=1;else delete S.rv["c:"+c.id];save();touchStreak();m.innerHTML=`<p class="cap">Результат</p><div class="sc">${sc} / ${Q.length}</div><p>${ok?"Комикс пройден, он отмечен галочкой.":"Прочитайте комикс ещё раз с переводом и попробуйте снова."}</p>${flag?'<div class="note">Больше половины ответов неверные: комикс добавлен в повторение.</div>':""}<div class="row"><button class="btn" id="b1">К комиксу</button><button class="btn pri" id="b2">На главную</button></div>`;$("#b1").onclick=()=>comic(c.id);$("#b2").onclick=home;return}
    const q=Q[n],o=shuf([q.a,...shuf(bank.filter(w=>w!==q.a)).slice(0,3)]);
    m.innerHTML=`<button class="btn sm" id="bkC" style="margin-bottom:10px">← Назад</button><div class="prog"><i style="width:${n/Q.length*100}%"></i></div><p class="cap">Вставьте пропущенное слово</p><div class="sign"><div class="in"><div class="big" style="font-size:26px">${q.tk.map((x,i)=>i===q.i?x.replace(/^[^.?!,]+/,"____"):sr(x)).join(" ")}</div><div>${q.r}</div></div></div><div class="opts" id="b">${o.map(w=>`<button class="opt" data-w="${w}">${sr(w)}</button>`).join("")}</div>`;
    $("#bkC").onclick=()=>comic(c.id);m.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const ok=b.dataset.w===q.a;m.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.w===q.a)x.classList.add("ok")});if(!ok)b.classList.add("bad");else sc++;say(q.tk.join(" "));
      m.insertAdjacentHTML("beforeend",`<div class="fb ${ok?"ok":"bad"}">${ok?"Верно!":"Правильно: "+sr(q.a)}</div><div class="row"><button class="btn pri" id="nx">Дальше</button></div>`);$("#nx").onclick=()=>{n++;step()}})};
  step();
}

  };
  return LV.map(l=>{
    const lv=l[0],us=U.filter(u=>u.lv===lv),x=meta[lv],n=us.reduce((a,u)=>a+u.items.filter(i=>S.p[i.id]).length,0),total=us.reduce((a,u)=>a+u.items.length,0);
    return `<section class="level-section lv-${lv.toLowerCase()}"><div class="level-heading"><span class="level-crest">${x.icon}</span><div><h2>${lv} · ${x.name}</h2><p>${x.desc}</p></div><span class="level-count">${us.length} модулей</span></div><div class="module-grid">${us.map(unitBtn).join("")}</div></section>`;
  }).join("");
}
// ---------- общее ----------
function paintSeg(){$("#bC").setAttribute("aria-pressed",S.script==="cyr");$("#bL").setAttribute("aria-pressed",S.script==="lat")}
const rerenderScriptView=()=>S.view==="alphabet"?alphabetModule(U.find(x=>x.id==="a")):home();
$("#bC").onclick=()=>{S.script="cyr";save();paintSeg();rerenderScriptView()};$("#bL").onclick=()=>{S.script="lat";save();paintSeg();rerenderScriptView()};
$("#home").onclick=home;paintSeg();home();
</script></body></html>
