<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Učimo srpski — курс сербского</title>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--ink:#14233a;--mute:#5b6b80;--line:#cdd5de;--panel:#fff;--sign:#1d3f72;--red:#c8323c;--ok:#2f7d4f;--okbg:#dff1e6;--badbg:#f8dfe1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1824;--ink:#e6edf5;--mute:#97a6ba;--line:#2a3a50;--panel:#18263a;--sign:#244b86;--red:#ef6670;--ok:#6fcf97;--okbg:#173a2a;--badbg:#44212a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1824;--ink:#e6edf5;--mute:#97a6ba;--line:#2a3a50;--panel:#18263a;--sign:#244b86;--red:#ef6670;--ok:#6fcf97;--okbg:#173a2a;--badbg:#44212a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.45 "Fira Sans",system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.w{max-width:560px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{font:700 27px/1.1 Alegreya,Georgia,serif;margin:0;cursor:pointer}
h1 small{display:block;font:400 13px "Fira Sans",sans-serif;color:var(--mute);margin-top:3px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;color:var(--ink);padding:7px 12px;font:600 14px "Fira Sans",sans-serif;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
h2{font:700 22px/1.2 Alegreya,Georgia,serif;margin:22px 0 10px}
.cap{color:var(--ink);font-size:16px;font-weight:500;margin:0 0 10px}
.stats{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:700 26px/1.1 Alegreya,Georgia,serif}
.btn{border:1.5px solid var(--ink);background:none;color:var(--ink);border-radius:12px;padding:13px 16px;font:600 16px "Fira Sans",sans-serif;cursor:pointer;width:100%}
.btn.pri{background:var(--ink);color:var(--bg)}.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;margin-top:12px}.row .btn{flex:1}.row .sm{flex:none;width:auto}
.unit{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:13px 14px;margin-bottom:9px;cursor:pointer;font:inherit}
.unit b{font:700 19px/1.2 Alegreya,Georgia,serif}.unit span{color:var(--ink);font-size:15px;display:block}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--red)}
.lock{opacity:.6;border-style:dashed}
.item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;color:var(--ink);font:inherit;text-align:left}
.item .e{font-size:30px;width:40px;text-align:center}.item .l{font:700 22px Alegreya,serif;width:50px;color:var(--red)}
.item div{flex:1}.item small{color:var(--mute);display:block}
.note{background:var(--panel);border:1.5px solid var(--line);border-left:5px solid var(--sign);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.sign{background:var(--sign);color:#fff;border-radius:18px;padding:12px;margin:8px 0}
.sign .in{border:2.5px solid rgba(255,255,255,.85);border-radius:11px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center}
.big{font:700 clamp(28px,8vw,40px)/1.15 Alegreya,Georgia,serif;overflow-wrap:anywhere}.pic{font-size:84px;line-height:1}
.opts{display:grid;gap:9px;margin-top:10px}.opts.g2{grid-template-columns:1fr 1fr}
.opt{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:13px;font:500 17px "Fira Sans",sans-serif;cursor:pointer;text-align:left}
.opt.e{font-size:44px;text-align:center;padding:8px}.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--red);background:var(--badbg)}
input.t{width:100%;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:12px;padding:13px;font:500 19px "Fira Sans",sans-serif}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;margin:8px 0}.tile{border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 12px;font:500 18px "Fira Sans",sans-serif;cursor:pointer}
.ans{border-bottom:2px solid var(--line);padding-bottom:8px}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-weight:500}.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.mic{font-size:44px;width:92px;height:92px;border-radius:50%;border:3px solid var(--red);background:var(--panel);cursor:pointer}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}.prog i{display:block;height:100%;background:var(--ink)}
.panel{border:2.5px solid var(--ink);border-radius:12px;background:var(--panel);margin:0 0 12px;overflow:hidden;padding-bottom:8px}
.scn{font-size:46px;text-align:center;padding:12px 6px;background:var(--line);letter-spacing:6px}
.ln{display:flex;align-items:flex-end;gap:8px;padding:10px 12px 4px;cursor:pointer}.ln.rt{flex-direction:row-reverse}.av{font-size:34px}
.bub{position:relative;background:var(--bg);border:2px solid var(--ink);border-radius:16px;padding:9px 12px;max-width:78%;font-weight:500}
.bub small{display:block;color:var(--mute);font-weight:400;font-size:14px;margin-top:3px}
.bub::before{content:"";position:absolute;bottom:10px;left:-9px;border-style:solid;border-width:7px 9px 7px 0;border-color:transparent var(--ink) transparent transparent}
.ln.rt .bub::before{left:auto;right:-9px;border-width:7px 0 7px 9px;border-color:transparent transparent transparent var(--ink)}
.bub.bad{border-color:var(--red);background:var(--badbg)}.bub.ph{color:var(--mute)}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.sc{font:700 60px/1 Alegreya,Georgia,serif;margin:16px 0 6px}
.grammar-card{border-left:5px solid var(--red)}.grammar-card .example{line-height:1.55}.theory{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}.theory h3{font:700 20px Alegreya,Georgia,serif;margin:0 0 8px}.theory p{margin:7px 0}.theory .example{background:var(--bg);border-radius:10px;padding:10px;margin-top:8px}.voicebar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.voicebar .btn{flex:1;min-width:130px}.completion-title{font-size:18px;font-weight:700;margin:0 0 10px;color:var(--ink)}.practice-sub{font:700 18px Alegreya,Georgia,serif;margin:15px 0 8px;color:var(--sign)}

{id:"a",lv:"A1",t:"Сербский алфавит: 30 букв",n:"Сербский читается так, как пишется: одна буква, один звук. Нет в русском: Ђ (мягкое «дь»), Ћ (мягкое «ть»), Ј (как «й»), Љ («ль»), Њ («нь»), Џ («дж»). Запись кириллицей и латиницей равноправна, переключатель вверху.",w:``,

const ADV_UNITS = [{"id":"b1-01","lv":"B1","t":"Падежи в речи I: родительный и дательный","n":"На этом этапе важно не просто знать окончания, а видеть, какое слово управляет падежом. Родительный часто появляется после предлогов со значением отсутствия, происхождения и причины, а также при отрицании. Дательный обозначает адресата, получателя и человека, которому что-либо помогает или нравится. Учите связки «глагол + падеж» целиком.","ruNarration":"В этом модуле систематизируем две группы падежных форм. Первая группа показывает отсутствие, принадлежность, происхождение и причину. Вторая группа обозначает адресата действия и человека, которому что-либо предназначено. Главное правило: падеж зависит не только от смысла, но и от предлога или глагола, поэтому полезно запоминать устойчивые сочетания.","detail":[{"t":"Родительный после предлогов","b":"После предлогов со значением «без», «из», «от», «у», «из-за» обычно нужна форма родительного падежа.","e":"bez dokumenta — без документа; iz centra — из центра; zbog kašnjenja — из-за задержки"},{"t":"Дательный при адресате","b":"Дательный отвечает на вопрос «кому?». Его требуют, например, глаголы со значением помогать, верить, объяснять, советовать.","e":"Pomažem prijatelju — я помогаю другу; Objasni klijentu — объясни клиенту"}],"bank":[["Bez pasoša ne mogu da putujem","Без паспорта я не могу путешествовать"],["Vraćam se iz centra grada","Я возвращаюсь из центра города"],["Kasnim zbog velikog saobraćaja","Я опаздываю из-за плотного движения"],["Nemam dovoljno vremena za sastanak","У меня недостаточно времени для встречи"],["Pismo je stiglo od koleginice","Письмо пришло от коллеги"],["Pomažem novom kolegi","Я помогаю новому коллеге"],["Verujem svom lekaru","Я доверяю своему врачу"],["Objasni mi problem, molim te","Объясни мне проблему, пожалуйста"],["Poslao sam dokument direktoru","Я отправил документ директору"],["Ova promena odgovara svim zaposlenima","Это изменение подходит всем сотрудникам"],["Radujem se našem susretu","Я радуюсь нашей встрече"],["Nedostaje mi nekoliko važnih podataka","Мне не хватает нескольких важных данных"],["Ne sećam se njegovog imena","Я не помню его имени"],["Zahvaljujem vam na pomoći","Благодарю вас за помощь"],["Bez vaše potvrde postupak ne može da se završi","Без вашего подтверждения процедуру нельзя завершить"],["Dajte prednost kvalitetu, a ne brzini","Отдавайте предпочтение качеству, а не скорости"]]},{"id":"b1-02","lv":"B1","t":"Падежи в речи II: винительный, творительный и местный","n":"Винительный часто обозначает прямой объект и направление движения. Творительный показывает инструмент, способ передвижения или совместность, особенно после предлогов sa и nad. Местный используется с предлогами и отвечает на вопрос «где?». Сравнивайте пары «куда?» и «где?»: изменение падежа меняет смысл всей фразы.","ruNarration":"Здесь мы научимся различать три падежа в реальных ситуациях. Винительный нужен, когда мы направляемся куда-либо или называем объект действия. Творительный помогает сказать, чем мы пользуемся, на чём едем и с кем общаемся. Местный указывает место, где кто-то находится или что-то происходит. Старайтесь задавать к каждому примеру вопрос: куда, где, чем или с кем.","detail":[{"t":"Объект и направление","b":"После многих глаголов действия прямой объект стоит в винительном. С предлогами направления форма тоже может быть винительной.","e":"Čekam autobus — жду автобус; Idem u kancelariju — иду в офис"},{"t":"Средство и место","b":"Творительный часто отвечает на «чем?» и «с кем?», местный — на «где?», обычно после u, na, o.","e":"Putujem vozom — еду поездом; Razgovaram sa koleginicom — говорю с коллегой; Radim u centru — работаю в центре"}],"bank":[["Čekam autobus ispred zgrade","Я жду автобус перед зданием"],["Tražim slobodno mesto u vozu","Я ищу свободное место в поезде"],["Svakog dana idem u kancelariju","Каждый день я иду в офис"],["Danas radim u biblioteci","Сегодня я работаю в библиотеке"],["Razgovaram sa novom koleginicom","Я разговариваю с новой коллегой"],["Putujemo službenim vozom","Мы едем служебным поездом"],["Otvorio je vrata ključem","Он открыл дверь ключом"],["Na stolu se nalazi važan dokument","На столе находится важный документ"],["Razmišljamo o sledećem koraku","Мы думаем о следующем шаге"],["Odluka zavisi od rezultata","Решение зависит от результата"],["Videla sam prijatelja na stanici","Я увидела друга на вокзале"],["Često razgovaramo o poslu","Мы часто разговариваем о работе"],["Idemo na sastanak sa direktorom","Мы идём на встречу с директором"],["U autobusu nema slobodnih mesta","В автобусе нет свободных мест"],["Poruku sam napisao olovkom","Сообщение я написал карандашом"],["O ovom pitanju razgovaraćemo sutra","Об этом вопросе мы поговорим завтра"]]},{"id":"b1-03","lv":"B1","t":"Вид глагола: процесс и результат","n":"Несовершенный вид описывает процесс, повторяемость или длительность. Совершенный вид представляет действие как завершённое целое или достигнутый результат. Часто пары различаются приставкой, но значение нельзя определять только по приставке: учите глаголы в парах и проверяйте, какой смысл нужен в конкретной ситуации.","ruNarration":"В сербском языке вид глагола особенно важен. Одна форма показывает, что действие продолжалось, повторялось или было привычным. Другая показывает, что действие завершилось или привело к результату. В рассказе эти формы часто работают вместе: сначала описываем фон, а затем называем событие, которое произошло.","detail":[{"t":"Процесс и привычка","b":"Для длительности, повторения и фона используйте несовершенный вид.","e":"Dok sam čitao, telefon je zazvonio — пока я читал, зазвонил телефон"},{"t":"Завершённый результат","b":"Для результата и единичного завершённого действия выбирайте совершенный вид.","e":"Pročitao sam izveštaj — я прочитал отчёт; Još nisam završio — я ещё не закончил"}],"bank":[["Čitao sam knjigu tokom putovanja","Я читал книгу во время поездки"],["Pročitao sam knjigu do kraja","Я дочитал книгу до конца"],["Svako jutro proveravam elektronsku poštu","Каждое утро я проверяю электронную почту"],["Već sam proverio sve podatke","Я уже проверил все данные"],["Dok smo razgovarali, stigla je poruka","Пока мы разговаривали, пришло сообщение"],["Moram da završim izveštaj danas","Мне нужно закончить отчёт сегодня"],["Juče sam završio važan projekat","Вчера я завершил важный проект"],["Pokušavao je da reši problem satima","Он пытался решить проблему несколько часов"],["Na kraju je uspeo da ga reši","В конце концов ему удалось решить её"],["Još nisam poslao prijavu","Я ещё не отправил заявку"],["Upravo sam poslao sve dokumente","Я только что отправил все документы"],["Često gledamo vesti uveče","Мы часто смотрим новости вечером"],["Sinoć smo pogledali ceo film","Вчера вечером мы посмотрели весь фильм"],["Kada radiš, nemoj stalno da prekidaš posao","Когда работаешь, не прерывай постоянно работу"],["Pre nego što izađem, proveriću vrata","Перед тем как выйти, я проверю дверь"],["Ako budeš vežbao redovno, primetićeš napredak","Если будешь регулярно заниматься, заметишь прогресс"]]},{"id":"b1-04","lv":"B1","t":"Глаголы движения и направление","n":"Глаголы движения различают направление, приближение, удаление и повторяемость. Важно не смешивать нейтральное «идти/ехать» с «приходить», «уходить», «входить» и «выходить». Приставка часто уточняет траекторию, но конкретное значение закрепляется в контексте. Обратите внимание и на пары «нести/принести», «вести/привести».","ruNarration":"В этом модуле разбираем глаголы движения и приставки. Важно понять, движется ли человек к говорящему, от него, внутрь помещения или наружу. Также различаем обычное направление и повторяющееся движение. В живой речи эти глаголы нужны, чтобы объяснить маршрут, опоздание, встречу и то, как мы перемещаем предметы.","detail":[{"t":"Приставки направления","b":"Приставки помогают показать приближение, удаление, вход, выход или пересечение границы.","e":"doći — прийти; otići — уйти; ući — войти; izaći — выйти"},{"t":"Повторяемое движение","b":"Для регулярного маршрута и привычки часто используются формы несовершенного вида.","e":"Svaki dan idem peške na posao — каждый день я хожу на работу пешком"}],"bank":[["Svaki dan idem na posao autobusom","Каждый день я езжу на работу на автобусе"],["Juče sam došao ranije nego obično","Вчера я пришёл раньше обычного"],["Moram da odem pre šest","Мне нужно уйти до шести"],["Uđite, molim vas, i zatvorite vrata","Войдите, пожалуйста, и закройте дверь"],["Izašao je iz zgrade bez kišobrana","Он вышел из здания без зонта"],["Kada stižeš u Novi Sad?","Когда ты прибываешь в Нови-Сад?"],["Vraćam se kući posle sastanka","Я возвращаюсь домой после встречи"],["Prošli smo pored stare tvrđave","Мы прошли мимо старой крепости"],["Skrenite desno kod sledeće ulice","Поверните направо на следующей улице"],["Pređite most i nastavite pravo","Перейдите мост и продолжайте прямо"],["Odneo sam paket u poštu","Я отнёс посылку на почту"],["Možeš li da mi doneseš punjač?","Можешь принести мне зарядное устройство?"],["Voz polazi sa drugog perona","Поезд отправляется со второй платформы"],["Autobus je upravo stigao na stanicu","Автобус только что прибыл на остановку"],["Ako kreneš sada, stići ćeš na vreme","Если выйдешь сейчас, успеешь вовремя"],["Dok sam se vraćao, sreo sam komšiju","Пока я возвращался, я встретил соседа"]]},{"id":"b1-05","lv":"B1","t":"Связный рассказ о прошлом","n":"Чтобы рассказ звучал естественно, чередуйте описание фона и завершённые события. Несовершенный вид показывает, что происходило или как долго длилась ситуация, совершенный — что изменилось или случилось. Связывайте события словами «сначала», «потом», «в тот момент», «как только», «перед тем как».","ruNarration":"Здесь учимся рассказывать о событиях не отдельными предложениями, а связной историей. Для фона используем формы, которые показывают длительность или привычку. Для главных событий — формы, которые подчёркивают завершение. Важно правильно соединять эпизоды во времени и не перескакивать между событиями без связок.","detail":[{"t":"Фон и событие","b":"Длительный фон обычно описывается несовершенным видом, а новое событие — совершенным.","e":"Dok sam čekao, počela je kiša — пока я ждал, начался дождь"},{"t":"Временные связки","b":"Союзы помогают показать последовательность, одновременность и границы событий.","e":"Čim sam stigao, pozvao sam te — как только я приехал, я тебе позвонил"}],"bank":[["Prošle nedelje sam putovao u Niš","На прошлой неделе я ездил в Ниш"],["Putovanje je trajalo skoro četiri sata","Путешествие длилось почти четыре часа"],["Dok smo čekali, razgovarali smo o poslu","Пока мы ждали, мы разговаривали о работе"],["Odjednom je nestalo struje","Внезапно отключилось электричество"],["Čim sam stigao, javio sam se porodici","Как только я приехал, я сообщил семье"],["Pre nego što sam izašao, zaključao sam vrata","Перед тем как выйти, я запер дверь"],["Kasnije smo saznali šta se dogodilo","Позже мы узнали, что произошло"],["Nisam primetio da je vreme brzo prošlo","Я не заметил, как быстро прошло время"],["U početku nisam poznavao nikoga","Сначала я никого не знал"],["Posle nekoliko dana stekao sam nove prijatelje","Через несколько дней я завёл новых друзей"],["Na kraju smo odlučili da ostanemo još jedan dan","В конце концов мы решили остаться ещё на один день"],["Sve se dogodilo mnogo brže nego što smo očekivali","Всё произошло гораздо быстрее, чем мы ожидали"],["Dok je Ana pripremala večeru, Marko je postavljao sto","Пока Ана готовила ужин, Марко накрывал на стол"],["Tek kasnije sam shvatio svoju grešku","Только позже я понял свою ошибку"],["Iako je padala kiša, nastavili smo put","Хотя шёл дождь, мы продолжили путь"],["To iskustvo ću dugo pamtiti","Я ещё долго буду помнить этот опыт"]]},{"id":"b1-06","lv":"B1","t":"Относительные местоимения: который, с которым, которому","n":"Относительное местоимение связывает существительное с поясняющей частью предложения. Род и число согласуются с существительным, к которому относится местоимение, а падеж определяется его ролью внутри придаточной части. Поэтому форма меняется: «человек, которого я знаю», «человек, которому я помог», «человек, с которым я работаю».","ruNarration":"В этом модуле учимся строить предложения со значением «человек, который…» или «документ, который…». Относительное местоимение согласуется с существительным по роду и числу, но падеж выбирается по его роли в придаточной части. Это важный нюанс: нельзя всегда использовать одну и ту же форму.","detail":[{"t":"Согласование","b":"Форма относительного местоимения согласуется с главным существительным по роду и числу.","e":"knjiga koja… — книга, которая…; dokumenti koji… — документы, которые…"},{"t":"Падеж внутри придаточной части","b":"Падеж зависит от глагола или предлога в придаточной части, а не от главного слова.","e":"osoba kojoj sam pomogao — человек, которому я помог; kolega sa kojim radim — коллега, с которым я работаю"}],"bank":[["Upoznao sam čoveka koji radi sa mojim bratom","Я познакомился с человеком, который работает с моим братом"],["To je knjiga koju sam pročitao prošlog leta","Это книга, которую я прочитал прошлым летом"],["Poznajem ženu kojoj si juče pomogao","Я знаю женщину, которой ты вчера помог"],["Ovo je kolega sa kojim sarađujem","Это коллега, с которым я сотрудничаю"],["Gde je dokument koji sam ti poslao?","Где документ, который я тебе отправил?"],["Tražim osobu koja govori nemački","Я ищу человека, который говорит по-немецки"],["To je restoran u kojem smo večerali","Это ресторан, в котором мы ужинали"],["Sećaš li se grada u kojem smo živeli?","Ты помнишь город, в котором мы жили?"],["Devojka čiji je telefon pronađen može da dođe po njega","Девушка, чей телефон нашли, может прийти за ним"],["Čovek čiju sam torbu pronašao već me je pozvao","Мужчина, чью сумку я нашёл, уже мне позвонил"],["To su ljudi kojima možemo da verujemo","Это люди, которым мы можем доверять"],["Imam prijatelje s kojima često putujem","У меня есть друзья, с которыми я часто путешествую"],["Pokaži mi poruku o kojoj si govorio","Покажи мне сообщение, о котором ты говорил"],["Treba mi formular na kojem piše datum","Мне нужен бланк, на котором указана дата"],["Izabrali smo ponudu koja najbolje odgovara našim potrebama","Мы выбрали предложение, которое лучше всего соответствует нашим потребностям"],["Nije pronašao osobu koju je tražio","Он не нашёл человека, которого искал"]]},{"id":"b1-07","lv":"B1","t":"Причина, следствие, время и цель","n":"Сложные предложения помогают объяснять не только что произошло, но и почему, когда и с какой целью. Различайте союз причины, оборот с предлогом и конструкцию цели. Если у двух частей разные исполнители действия, для цели часто используется отдельная конструкция с частицей «чтобы» и формой настоящего времени.","ruNarration":"В этом модуле соединяем несколько предложений в одну логичную мысль. Научимся объяснять причину, показывать следствие, указывать время действия и формулировать цель. Обратите внимание: причина может вводиться союзом или предлогом, а конструкция цели зависит от того, кто выполняет действие.","detail":[{"t":"Причина и следствие","b":"Союзы причины связывают два действия, а выражение следствия показывает результат.","e":"Ostao sam kod kuće jer sam bio bolestan — я остался дома, потому что болел"},{"t":"Цель","b":"Когда цель относится к другому исполнителю, используйте конструкцию цели с отдельным подлежащим.","e":"Došao sam da razgovaram sa direktorom — я пришёл, чтобы поговорить с директором"}],"bank":[["Nisam došao zato što sam imao obaveze","Я не пришёл, потому что у меня были дела"],["Zbog kvara smo morali da promenimo plan","Из-за поломки нам пришлось изменить план"],["Radio je dodatno kako bi završio projekat","Он работал дополнительно, чтобы завершить проект"],["Došla sam ranije da bismo imali dovoljno vremena","Я пришла раньше, чтобы у нас было достаточно времени"],["Čim dobijem odgovor, obavestiću te","Как только получу ответ, сообщу тебе"],["Dok čekamo rezultate, možemo da pripremimo izveštaj","Пока мы ждём результаты, можем подготовить отчёт"],["Pošto je sastanak otkazan, otišli smo kući","Поскольку встречу отменили, мы пошли домой"],["Nije mogao da uđe jer je zaboravio karticu","Он не смог войти, потому что забыл карту"],["Uštedeo je novac da bi kupio stan","Он накопил деньги, чтобы купить квартиру"],["Ponesi kišobran za slučaj da počne da pada kiša","Возьми зонт на случай, если начнётся дождь"],["Tako smo rešili problem bez dodatnih troškova","Так мы решили проблему без дополнительных расходов"],["Vreme se pogoršalo, pa smo odložili putovanje","Погода ухудшилась, поэтому мы отложили поездку"],["Pre nego što potpišeš, pažljivo pročitaj ugovor","Перед тем как подписать, внимательно прочитай договор"],["Nakon što završimo posao, otići ćemo na večeru","После того как закончим работу, пойдём ужинать"],["Ponavljam pravilo da ga ne bih zaboravio","Я повторяю правило, чтобы его не забыть"],["Ostavio sam poruku kako bi znali gde sam","Я оставил сообщение, чтобы они знали, где я"]]},{"id":"b1-08","lv":"B1","t":"Условия и будущее: если, когда, как только","n":"В реальном условии после союза со значением «если» обычно используется настоящее время, а в главной части — будущее или повелительная форма. Когда речь о будущем моменте, часто используется форма будущего II. Важно не переносить русскую модель буквально и не ставить будущее I в придаточной части после временных и условных союзов.","ruNarration":"Учимся говорить о реальных условиях и будущих событиях. В сербском языке в придаточной части после слов со значением «если» и «когда» часто используется специальная форма будущего II или настоящее время, а будущее действие выражается в главной части. Это правило особенно важно для естественной речи.","detail":[{"t":"Реальное условие","b":"После условного союза в реальном условии часто ставится настоящее время, а результат выражается в главной части.","e":"Ako imaš vremena, pozovi me — если у тебя будет время, позвони мне"},{"t":"Будущее II","b":"Для действия, которое должно завершиться до другого будущего события, используется Futur II.","e":"Kad budem završio posao, javiću ti se — когда закончу работу, я свяжусь с тобой"}],"bank":[["Ako bude lepo vreme, ići ćemo na izlet","Если погода будет хорошей, мы поедем на экскурсию"],["Ako stigneš ranije, sačekaj me ispred zgrade","Если придёшь раньше, подожди меня перед зданием"],["Kad budem imao odgovor, poslaću ti poruku","Когда у меня будет ответ, я отправлю тебе сообщение"],["Čim završimo sastanak, pozvaćemo taksi","Как только закончим встречу, вызовем такси"],["Ako ne razumeš pitanje, slobodno pitaj","Если не понимаешь вопрос, смело спрашивай"],["Javi mi ako budeš kasnio","Сообщи мне, если будешь опаздывать"],["Kada budemo stigli, prvo ćemo se odmoriti","Когда приедем, сначала отдохнём"],["Ako ne pronađemo adresu, pozvaćemo domaćina","Если не найдём адрес, позвоним хозяину"],["Kad budeš imao vremena, pregledaj ovaj dokument","Когда у тебя будет время, просмотри этот документ"],["Ukoliko se problem ponovi, obratite se podršci","Если проблема повторится, обратитесь в поддержку"],["Ako želiš, mogu da ti objasnim još jednom","Если хочешь, я могу объяснить тебе ещё раз"],["Nećemo krenuti dok svi ne budu spremni","Мы не отправимся, пока все не будут готовы"],["Čim budem znao datum, rezervisaću kartu","Как только я буду знать дату, забронирую билет"],["Ako bude potrebno, promenićemo termin","Если потребуется, мы изменим время"],["Kad dođeš kući, zaključaj vrata","Когда придёшь домой, запри дверь"],["Ukoliko imate dodatna pitanja, pišite nam","Если у вас есть дополнительные вопросы, напишите нам"]]},{"id":"b1-09","lv":"B1","t":"Вежливые просьбы и кондиционал","n":"Условное наклонение помогает сделать просьбу мягче, выразить желание или гипотетический результат. Формы с «бы» сочетаются с причастием и меняются по лицу, а причастие — по роду и числу. В просьбах часто используется вежливое обращение во множественном числе и конструкции с «могли бы».","ruNarration":"Здесь мы переходим от прямых просьб к более мягким и вежливым формулировкам. Условное наклонение помогает сказать, что вы хотели бы что-то сделать, попросить собеседника о помощи или осторожно предложить решение. Следите за формой говорящего по роду и за согласованием вспомогательной части.","detail":[{"t":"Форма кондиционала","b":"Для условного наклонения используются краткие формы вспомогательного глагола и причастие.","e":"Želeo bih — я хотел бы (мужчина); Želela bih — я хотела бы (женщина)"},{"t":"Вежливый запрос","b":"Для просьбы часто подходит условная форма в сочетании с глаголом со значением мочь.","e":"Da li biste mogli da mi pomognete? — Не могли бы вы мне помочь?"}],"bank":[["Želeo bih da zakažem sastanak","Я хотел бы назначить встречу"],["Želela bih da razgovaram sa odgovornom osobom","Я хотела бы поговорить с ответственным сотрудником"],["Da li biste mogli da ponovite pitanje?","Не могли бы вы повторить вопрос?"],["Bilo bi dobro da proverimo sve podatke","Было бы хорошо проверить все данные"],["Rado bih prihvatio vašu ponudu","Я с удовольствием принял бы ваше предложение"],["Voleli bismo da rezervišemo sto za četvoro","Мы хотели бы забронировать столик на четверых"],["Da li biste mi poslali potvrdu elektronskom poštom?","Не могли бы вы прислать мне подтверждение по электронной почте?"],["Mogao bih da dođem u petak popodne","Я мог бы прийти в пятницу после обеда"],["Da sam slobodan, rado bih vam pomogao","Если бы я был свободен, я бы с радостью вам помог"],["Ne bih želeo da vam oduzimam mnogo vremena","Я не хотел бы отнимать у вас много времени"],["Biste li želeli da sednete ovde?","Не хотели бы вы присесть здесь?"],["Bilo bi korisno da razgovaramo o detaljima","Было бы полезно обсудить детали"],["Možete li, molim vas, da mi objasnite postupak?","Можете ли вы, пожалуйста, объяснить мне процедуру?"],["Izvinite, da li biste mogli da sačekate nekoliko minuta?","Извините, не могли бы вы подождать несколько минут?"],["Voleo bih da čujem i vaše mišljenje","Я хотел бы услышать и ваше мнение"],["Trebalo bi da razmotrimo još jednu mogućnost","Нам следовало бы рассмотреть ещё одну возможность"]]},{"id":"b1-10","lv":"B1","t":"Косвенные вопросы и передача информации","n":"Косвенный вопрос становится частью другого предложения: «я не знаю, где…», «она спросила, придём ли…». Внутри него сохраняется обычный порядок слов, а вопросительная интонация не обязательна. Передавая чужие слова, используйте глаголы речи и следите за тем, чтобы смысл и время оставались понятными.","ruNarration":"В этом модуле учимся пересказывать, что сказал или спросил другой человек. Прямой вопрос можно встроить в большое предложение, например сказать, что вы не знаете, где находится нужное место. В косвенном вопросе не нужно менять обычный порядок слов. Также тренируем передачу просьб и сообщений коллег.","detail":[{"t":"Косвенный вопрос","b":"Косвенный вопрос вводится глаголами «знать», «спросить», «интересоваться» и сохраняет порядок слов утверждения.","e":"Ne znam gde se nalazi stanica — я не знаю, где находится вокзал"},{"t":"Передача слов","b":"Сообщение часто передаётся через союз со значением «что», вопрос — через «ли» или вопросительное слово.","e":"Rekao je da kasni — он сказал, что опаздывает; Pitala je da li dolazimo — она спросила, придём ли мы"}],"bank":[["Ne znam gde se nalazi najbliža apoteka","Я не знаю, где находится ближайшая аптека"],["Možeš li da mi kažeš kada počinje sastanak?","Можешь сказать мне, когда начинается встреча?"],["Pitala me je da li dolazim sutra","Она спросила меня, приду ли я завтра"],["Rekao je da će poslati dokument danas","Он сказал, что отправит документ сегодня"],["Nisam razumeo šta je želela da kaže","Я не понял, что она хотела сказать"],["Znaš li ko je ostavio ovu poruku?","Ты знаешь, кто оставил это сообщение?"],["Direktor je objasnio zašto je promenjen plan","Директор объяснил, почему был изменён план"],["Pitao sam ih kada će stići rezultati","Я спросил их, когда будут результаты"],["Koleginica mi je rekla da je već završila posao","Коллега сказала мне, что уже закончила работу"],["Ne sećam se gde smo parkirali automobil","Я не помню, где мы припарковали машину"],["Objasnite mi kako funkcioniše ova aplikacija","Объясните мне, как работает это приложение"],["Čuo sam da se otvara nova prodavnica","Я слышал, что открывается новый магазин"],["Niko ne zna ko je doneo tu odluku","Никто не знает, кто принял это решение"],["Pitali su nas zbog čega kasnimo","Они спросили нас, почему мы опаздываем"],["Rekla mi je da ne može da dođe na vreme","Она сказала мне, что не может прийти вовремя"],["Zanima me da li postoji druga mogućnost","Меня интересует, есть ли другая возможность"]]},{"id":"b1-11","lv":"B1","t":"Жизненные ситуации: учреждения и решение проблем","n":"В бытовых и административных ситуациях важно точно описывать проблему, сообщать, что уже сделано, и просить о следующем шаге. Используйте совершенный вид для конкретного результата, несовершенный — для процесса, а падежи — в устойчивых сочетаниях с документами, услугами и обращениями.","ruNarration":"Модуль объединяет грамматику с реальными задачами: запись к врачу, обращение в банк, оформление документов, поиск потерянной вещи. Важно уметь кратко описать, что произошло, назвать нужный документ и вежливо уточнить, что следует сделать дальше. В таких ситуациях точность важнее сложных слов.","detail":[{"t":"Описание проблемы","b":"Используйте форму завершённого действия, если сообщаете о конкретном результате или событии.","e":"Izgubio sam karticu — я потерял карту; Prijavio sam problem — я сообщил о проблеме"},{"t":"Просьба о процедуре","b":"Вежливый вопрос помогает уточнить следующий шаг и список необходимых документов.","e":"Šta treba da uradim? — Что мне нужно сделать?"}],"bank":[["Izgubio sam novčanik u autobusu","Я потерял кошелёк в автобусе"],["Želeo bih da prijavim izgubljenu karticu","Я хотел бы заявить о потерянной карте"],["Da li je potrebno da popunim ovaj obrazac?","Нужно ли мне заполнить этот бланк?"],["Koja dokumenta treba da ponesem?","Какие документы мне нужно принести?"],["Već sam poslao zahtev elektronskom poštom","Я уже отправил запрос по электронной почте"],["Još nisam dobio potvrdu","Я ещё не получил подтверждение"],["Možete li da proverite status moje prijave?","Можете проверить статус моего заявления?"],["Potrebna mi je kopija ugovora","Мне нужна копия договора"],["Prilikom prijave navedite tačan datum","При подаче заявления укажите точную дату"],["Službenik mi je objasnio sledeći korak","Сотрудник объяснил мне следующий шаг"],["Moram da promenim termin pregleda","Мне нужно изменить время приёма"],["Da li postoji mogućnost da platim kasnije?","Есть ли возможность заплатить позже?"],["Račun je izdat na pogrešno ime","Счёт выписан на неправильное имя"],["Molim vas da ispravite ove podatke","Прошу вас исправить эти данные"],["Kome mogu da se obratim za dodatne informacije?","К кому я могу обратиться за дополнительной информацией?"],["Hvala vam što ste brzo rešili problem","Спасибо, что быстро решили проблему"]]},{"id":"b1-12","lv":"B1","t":"Выражение мнения и аргументация","n":"Чтобы обсуждать темы на уровне B1, недостаточно сказать «нравится» или «не нравится». Учитесь обозначать позицию, приводить причину, сравнивать варианты, признавать другую точку зрения и делать вывод. Используйте связки противопоставления и уступки, а также конструкции сравнения и степени.","ruNarration":"В заключительном модуле B1 тренируем связную речь и аргументацию. Вы научитесь формулировать мнение, объяснять причины, сравнивать два решения и мягко не соглашаться. Хорошая аргументация состоит из позиции, примера или причины и короткого вывода. Старайтесь не повторять одно и то же слово, а использовать разные связки.","detail":[{"t":"Позиция и причина","b":"Сначала сформулируйте мнение, затем добавьте объяснение или пример.","e":"Po mom mišljenju, ovo je dobro rešenje — по моему мнению, это хорошее решение"},{"t":"Уступка и противопоставление","b":"Уступительные союзы позволяют признать часть аргумента собеседника и продолжить свою мысль.","e":"Iako je skuplje, kvalitet je bolji — хотя это дороже, качество лучше"}],"bank":[["Po mom mišljenju, ovaj predlog je veoma koristan","По моему мнению, это предложение очень полезно"],["Slažem se sa tobom u ovom delu","Я согласен с тобой в этой части"],["Ipak, mislim da postoji bolje rešenje","И всё же я думаю, что есть решение получше"],["S jedne strane, ovo je brže, a s druge strane je skuplje","С одной стороны, это быстрее, а с другой — дороже"],["U poređenju sa prošlom godinom, rezultati su bolji","По сравнению с прошлым годом результаты лучше"],["Glavna prednost ovog plana jeste njegova jednostavnost","Главное преимущество этого плана — его простота"],["Ne slažem se u potpunosti sa tim zaključkom","Я не полностью согласен с этим выводом"],["Razumem tvoje razloge, ali imam drugačije mišljenje","Я понимаю твои причины, но у меня другое мнение"],["Iako je ideja zanimljiva, teško ju je sprovesti","Хотя идея интересная, её трудно реализовать"],["Zbog toga smatram da treba da sačekamo","Поэтому я считаю, что нам нужно подождать"],["Ovaj način je pouzdaniji od prethodnog","Этот способ надёжнее предыдущего"],["Najvažnije je da pronađemo dugoročno rešenje","Самое важное — найти долгосрочное решение"],["Na primer, prošlog meseca smo imali sličan problem","Например, в прошлом месяце у нас была похожая проблема"],["To ne znači da je drugi predlog pogrešan","Это не означает, что второе предложение неверно"],["Konačno, trebalo bi da uporedimo sve mogućnosti","В заключение нам следовало бы сравнить все возможности"],["Voleo bih da čujem kako vi gledate na ovaj problem","Я хотел бы услышать, как вы смотрите на эту проблему"]]},{"id":"b2-01","lv":"B2","t":"Тонкости глагольного вида и приставок","n":"На B2 важно выбирать вид не только по правилу «процесс или результат», но и по смыслу контекста: попытка, достижение результата, повторная проверка, продолжение или единичное наблюдение. Приставка может менять значение глагола, поэтому не следует механически добавлять её к любой форме. Сравнивайте устойчивые видовые пары и типичные дополнения.","ruNarration":"В этом модуле углубляем понимание глагольного вида. Важно различать сам процесс, попытку выполнить действие, повторяющееся действие и достигнутый результат. Приставки часто меняют не только вид, но и значение глагола, поэтому каждую пару нужно изучать в контексте, с типичными дополнениями и временными формами.","detail":[{"t":"Повторяемое действие и результат","b":"Несовершенная форма подчёркивает процесс проверки или наблюдения, совершенная — итоговую проверку или вывод.","e":"Proveravali smo podatke — мы проверяли данные; Proverili smo podatke — мы проверили данные"},{"t":"Глаголы со значением попытки","b":"Не смешивайте попытку и успешное выполнение: это разные смысловые этапы.","e":"Pokušavao je da objasni — он пытался объяснить; Uspeo je da objasni — ему удалось объяснить"}],"bank":[["Dugo smo razmatrali različite mogućnosti","Мы долго рассматривали разные возможности"],["Na kraju smo razmotrili i poslednji predlog","В конце мы рассмотрели и последнее предложение"],["Pokušavao je da uspostavi kontakt","Он пытался установить контакт"],["Konačno je uspostavio kontakt sa klijentom","Наконец он установил контакт с клиентом"],["Redovno proveravamo kvalitet podataka","Мы регулярно проверяем качество данных"],["Proverili smo sve iznose pre slanja","Мы проверили все суммы перед отправкой"],["Nastavili su razgovor nakon kratke pauze","Они продолжили разговор после короткого перерыва"],["Nastavljali su da rade uprkos teškoćama","Они продолжали работать несмотря на трудности"],["Tek tada sam primetio važnu razliku","Только тогда я заметил важное различие"],["Posmatrali smo promene tokom nekoliko meseci","Мы наблюдали изменения в течение нескольких месяцев"],["Uočili smo obrazac koji se stalno ponavlja","Мы заметили закономерность, которая постоянно повторяется"],["Nije uspeo da pronađe odgovarajuće rešenje","Ему не удалось найти подходящее решение"],["Dokument je trebalo dodatno proveriti","Документ следовало дополнительно проверить"],["Sve detalje ćemo razmotriti na sledećem sastanku","Все детали мы рассмотрим на следующей встрече"],["Povremeno se vraćamo na ista pitanja","Время от времени мы возвращаемся к тем же вопросам"],["Ovim postupkom izbegli smo nepotrebne greške","Этим способом мы избежали ненужных ошибок"]]},{"id":"b2-02","lv":"B2","t":"Нереальное условие в прошлом","n":"Для ситуации, которая не произошла в прошлом, сербский использует условную конструкцию в обеих частях: в условии — форму с «бы» или конструкцию с союзом «да» и соответствующей формой, в результате — кондиционал. Смысл часто связан с сожалением, упущенной возможностью или альтернативным сценарием. Не путайте реальное условие с контрфактическим.","ruNarration":"В этом модуле разбираем гипотетические ситуации в прошлом: что могло бы произойти, если бы обстоятельства были другими. Такие фразы нужны, чтобы выразить сожаление, объяснить ошибку или представить альтернативный результат. Смысл определяется всей конструкцией, а не одним отдельным словом.","detail":[{"t":"Сожаление о прошлом","b":"Нереальное условие показывает, что условие не было выполнено, поэтому результат тоже не наступил.","e":"Da sam znao, došao bih ranije — если бы я знал, я бы пришёл раньше"},{"t":"Альтернативный результат","b":"Можно указать, что другой выбор или обстоятельства привели бы к иному результату.","e":"Da smo krenuli ranije, stigli bismo na vreme — если бы мы выехали раньше, то прибыли бы вовремя"}],"bank":[["Da sam znao za promenu, došao bih ranije","Если бы я знал об изменении, я бы пришёл раньше"],["Da smo rezervisali sto, ne bismo čekali","Если бы мы забронировали столик, нам бы не пришлось ждать"],["Da je proverila adresu, ne bi se izgubila","Если бы она проверила адрес, она бы не заблудилась"],["Da nismo zakasnili, videli bismo početak predstave","Если бы мы не опоздали, мы бы увидели начало спектакля"],["Da si me pozvao, pomogao bih ti","Если бы ты мне позвонил, я бы тебе помог"],["Da su imali više vremena, završili bi projekat","Если бы у них было больше времени, они бы завершили проект"],["Mogli smo da izbegnemo problem da smo reagovali ranije","Мы могли бы избежать проблемы, если бы отреагировали раньше"],["Da nisam pogrešio broj, razgovarali bismo","Если бы я не ошибся номером, мы бы поговорили"],["Volela bih da sam prihvatila taj posao","Я бы хотела, чтобы тогда приняла ту работу"],["Da je vreme bilo bolje, ostali bismo duže","Если бы погода была лучше, мы бы остались дольше"],["Ne bismo doneli takvu odluku da smo znali sve činjenice","Мы бы не приняли такое решение, если бы знали все факты"],["Da si pažljivije pročitao ugovor, primetio bi razliku","Если бы ты внимательнее прочитал договор, заметил бы разницу"],["Mogao je da uspe da je imao podršku","Он мог бы добиться успеха, если бы у него была поддержка"],["Da smo ranije počeli, već bismo završili","Если бы мы начали раньше, то уже закончили бы"],["To se ne bi dogodilo da su svi poštovali dogovor","Этого бы не произошло, если бы все соблюдали договорённость"],["Sada bismo bili na putu da nismo promenili plan","Сейчас мы были бы в пути, если бы не изменили план"]]},{"id":"b2-03","lv":"B2","t":"Пассивные конструкции и безличный стиль","n":"Пассив смещает внимание с исполнителя на действие или результат. В сербском он часто строится с формой глагола «быть» и страдательным причастием, согласованным с существительным. В официальном и деловом стиле также используются безличные формулировки, но их не нужно подменять пассивом там, где важен конкретный исполнитель.","ruNarration":"Здесь учимся выбирать между активной и пассивной конструкцией. Активная фраза подчёркивает, кто выполнил действие, а пассивная — что произошло с объектом или в каком состоянии он находится. Это особенно полезно для новостей, документов, инструкций и деловой переписки.","detail":[{"t":"Пассив и согласование","b":"Страдательное причастие согласуется с объектом по роду и числу.","e":"Ugovor je potpisan — договор подписан; Dokumenta su poslata — документы отправлены"},{"t":"Безличная формулировка","b":"В официальной речи можно описывать процедуру, не называя исполнителя, если он не важен.","e":"Prijava se obrađuje — заявление обрабатывается"}],"bank":[["Ugovor je potpisan juče","Договор был подписан вчера"],["Svi podaci su sačuvani u sistemu","Все данные сохранены в системе"],["Prijava će biti obrađena u roku od tri dana","Заявление будет обработано в течение трёх дней"],["Odluka je doneta nakon detaljne analize","Решение было принято после подробного анализа"],["Paket je poslat na navedenu adresu","Посылка отправлена на указанный адрес"],["Dokumentacija još nije kompletirana","Документация ещё не завершена"],["Rezultati će biti objavljeni sledeće nedelje","Результаты будут опубликованы на следующей неделе"],["Sastanak je odložen zbog nepredviđenih okolnosti","Встреча была отложена из-за непредвиденных обстоятельств"],["U ovom postupku koriste se dodatne provere","В этой процедуре используются дополнительные проверки"],["Od zaposlenih se očekuje da poštuju pravila","От сотрудников ожидается соблюдение правил"],["Podaci su provereni pre konačne odluke","Данные были проверены перед окончательным решением"],["Nova pravila stupaju na snagu prvog januara","Новые правила вступают в силу первого января"],["Pristup je omogućen svim članovima tima","Доступ предоставлен всем членам команды"],["Zahtev je vraćen na dopunu","Запрос возвращён на доработку"],["U izveštaju su navedeni svi važni razlozi","В отчёте указаны все важные причины"],["O tome će biti odlučeno na narednoj sednici","Это будет решено на следующем заседании"]]},{"id":"b2-04","lv":"B2","t":"Косвенная речь и пересказ сложной информации","n":"Косвенная речь позволяет передавать содержание заявления, вопроса или просьбы без дословного цитирования. Выбирайте подходящий глагол речи и союзную конструкцию. Время и лицо соотносятся с реальной ситуацией: важно сохранить исходный смысл, а не механически менять все времена по модели другого языка.","ruNarration":"В этом модуле учимся пересказывать длинные сообщения и передавать позицию другого человека. Косвенная речь часто встречается в деловых разговорах, новостях и обсуждениях. Важно правильно встроить вопрос или утверждение в новое предложение и сохранить точку зрения говорящего.","detail":[{"t":"Сообщение и вопрос","b":"Утверждение обычно вводится союзом «что», а косвенный вопрос — вопросительным словом или частицей «ли».","e":"Rekao je da nema vremena — он сказал, что у него нет времени; Pitao je da li dolazimo — он спросил, придём ли мы"},{"t":"Сохранение смысла","b":"Не меняйте время автоматически: выбирайте форму по реальному времени события и контексту пересказа.","e":"Objasnila je da radi od kuće — она объяснила, что работает из дома"}],"bank":[["Direktor je rekao da će odluka biti objavljena sutra","Директор сказал, что решение объявят завтра"],["Koleginica je objasnila zašto je promenila plan","Коллега объяснила, почему изменила план"],["Pitao me je da li sam pročitao izveštaj","Он спросил меня, прочитал ли я отчёт"],["Rekla je da ne može da prisustvuje sastanku","Она сказала, что не может присутствовать на встрече"],["Novinar je naveo da su pregovori nastavljeni","Журналист сообщил, что переговоры продолжились"],["Svedok je izjavio da nije video događaj","Свидетель заявил, что не видел происшествия"],["Pitali su nas kada očekujemo konačne rezultate","Они спросили нас, когда мы ожидаем окончательные результаты"],["Objasnio sam im kako smo došli do zaključka","Я объяснил им, как мы пришли к выводу"],["Ona tvrdi da nije dobila nikakvo obaveštenje","Она утверждает, что не получала никакого уведомления"],["Saopštili su da će radovi trajati još dve nedelje","Они сообщили, что работы продлятся ещё две недели"],["Nije jasno ko je odobrio ovu promenu","Неясно, кто одобрил это изменение"],["Pitao sam ga šta bi uradio u takvoj situaciji","Я спросил его, что бы он сделал в такой ситуации"],["Prema njenim rečima, sastanak je već završen","По её словам, встреча уже закончилась"],["Iz poruke se vidi da je rok pomeren","Из сообщения видно, что срок перенесли"],["Naglasio je da je potrebno dodatno proveriti podatke","Он подчеркнул, что необходимо дополнительно проверить данные"],["Kasnije je potvrdila ono što smo već pretpostavljali","Позже она подтвердила то, что мы уже предполагали"]]},{"id":"b2-05","lv":"B2","t":"Порядок слов и энклитики в длинной фразе","n":"Краткие безударные формы не могут начинать самостоятельное предложение и обычно занимают вторую позицию после первого ударного слова или целой группы. Когда встречается несколько энклитик, их порядок фиксирован. Полные члены предложения могут перемещаться ради акцента, но краткая группа сохраняет внутреннюю последовательность.","ruNarration":"Это одна из самых характерных тем сербского синтаксиса. Краткие формы местоимений и вспомогательных глаголов не ставятся в начало предложения: они располагаются во второй позиции и образуют устойчивую группу. Когда таких форм несколько, порядок между ними тоже важен. Потренируем фразы с прошедшим временем, местоимениями и условным наклонением.","detail":[{"t":"Вторая позиция","b":"Краткая форма следует после первого ударного слова или первой полноценной группы, а не обязательно после первого отдельного слова.","e":"Juče sam razgovarao sa direktorom — вчера я разговаривал с директором"},{"t":"Порядок группы","b":"В группе энклитик вопросительная частица предшествует краткому вспомогательному глаголу, затем следуют краткие местоимения; форма je в некоторых сочетаниях занимает конечную позицию.","e":"Juče mi ga je poslao — вчера он мне его отправил"}],"bank":[["Juče sam razgovarao sa novim direktorom","Вчера я разговаривал с новым директором"],["Moja sestra mi je poslala fotografije","Моя сестра прислала мне фотографии"],["Juče mi ga je poslao elektronskom poštom","Вчера он отправил мне его по электронной почте"],["Mogu li da ti ga pošaljem večeras?","Могу ли я отправить тебе его сегодня вечером?"],["Da li bi nam objasnili sledeći korak?","Не объяснили бы вы нам следующий шаг?"],["Ovaj dokument sam vam već poslao","Этот документ я вам уже отправил"],["Kada mi budeš odgovorio, nastavićemo razgovor","Когда ты мне ответишь, мы продолжим разговор"],["Marko je rekao da mu je Ana pomogla","Марко сказал, что Ана ему помогла"],["Nisam joj ga još pokazao","Я ещё не показал ей его"],["Ako mi ih pošalješ, proveriću ih odmah","Если отправишь мне их, я сразу их проверю"],["Zašto mi nisi javio da kasniš?","Почему ты не сообщил мне, что опаздываешь?"],["Rekla mi je da će nas sačekati ispred zgrade","Она сказала мне, что подождёт нас перед зданием"],["Ne bih vam to preporučio bez dodatne provere","Я бы не рекомендовал вам это без дополнительной проверки"],["Taj predlog nam se čini veoma zanimljivim","Это предложение кажется нам очень интересным"],["Da li ste mu već odgovorili?","Вы ему уже ответили?"],["Knjigu sam joj vratio prošle nedelje","Книгу я вернул ей на прошлой неделе"]]},{"id":"b2-06","lv":"B2","t":"Сложные относительные конструкции","n":"На продвинутом уровне относительные местоимения связывают несколько частей предложения и требуют точного согласования. Форма определяется родом и числом определяемого слова, но падеж — ролью внутри придаточного. В конструкциях со значением принадлежности используются формы от «чей», которые тоже изменяются.","ruNarration":"В этом модуле усложняем предложения с относительными местоимениями. Нужно одновременно учитывать, к какому существительному относится местоимение, и какую функцию оно выполняет внутри придаточной части. Особенно внимательно следите за формами после предлогов и за конструкциями принадлежности.","detail":[{"t":"Роль внутри придаточной","b":"Падеж относительного местоимения выбирается по глаголу или предлогу в той части предложения, которую оно вводит.","e":"projekat na kojem radimo — проект, над которым мы работаем"},{"t":"Принадлежность","b":"Формы со значением «чей» согласуются с предметом, который принадлежит человеку.","e":"žena čiji je automobil — женщина, чья машина"}],"bank":[["To je projekat na kojem radimo već šest meseci","Это проект, над которым мы работаем уже шесть месяцев"],["Upoznali smo stručnjaka čije radove često čitamo","Мы познакомились со специалистом, чьи работы часто читаем"],["Razgovarala sam sa osobom kojoj je dodeljena odgovornost","Я разговаривала с человеком, которому поручили ответственность"],["To su uslovi pod kojima možemo da nastavimo saradnju","Это условия, при которых мы можем продолжить сотрудничество"],["Ne razumem razlog zbog kojeg je odluka promenjena","Я не понимаю причину, по которой решение изменили"],["Pronašli su dokumente bez kojih postupak ne može da se završi","Они нашли документы, без которых процедуру нельзя завершить"],["Kandidat čije iskustvo odgovara zahtevima biće pozvan","Кандидат, чей опыт соответствует требованиям, будет приглашён"],["To je firma u kojoj je moja sestra radila","Это компания, в которой работала моя сестра"],["Osoba sa kojom sam razgovarao poslaće vam ponudu","Человек, с которым я разговаривал, пришлёт вам предложение"],["Nije jasno kome pripadaju podaci koje smo pronašli","Неясно, кому принадлежат данные, которые мы нашли"],["To je pitanje o kojem se dugo raspravljalo","Это вопрос, который долго обсуждали"],["Upoznali smo porodicu čija se kuća nalazi pored reke","Мы познакомились с семьёй, чей дом находится у реки"],["Sve što ste naveli biće uzeto u obzir","Всё, что вы указали, будет принято во внимание"],["Nedostaju informacije na osnovu kojih bismo doneli odluku","Не хватает информации, на основе которой мы могли бы принять решение"],["Izabrali su rešenje kojem se niko nije protivio","Они выбрали решение, которому никто не возражал"],["To je način na koji obično rešavamo takve probleme","Это способ, которым мы обычно решаем такие проблемы"]]},{"id":"b2-07","lv":"B2","t":"Уступка, противопоставление и сложные союзы","n":"Уступительные конструкции показывают, что результат наступил вопреки ожидаемому обстоятельству. Противопоставление связывает разные аргументы, а ограничительные обороты уточняют условия. На B2 важно различать союз и предлог: после предлогов требуется именная форма, а после союзов — придаточная часть с глаголом.","ruNarration":"Здесь мы учимся выражать сложные отношения между идеями: уступку, ограничение, противопоставление и оговорку. Такие конструкции позволяют звучать убедительнее и точнее. Обращайте внимание на разницу между союзом, после которого идёт целое предложение, и предлогом, после которого следует существительное или местоимение в нужном падеже.","detail":[{"t":"Уступительные союзы","b":"Союзы со значением «хотя» вводят придаточную часть с собственным сказуемым.","e":"Iako je kasno, nastavićemo — хотя поздно, мы продолжим"},{"t":"Предложные обороты","b":"После оборота со значением «несмотря на» используется именная группа в соответствующем падеже.","e":"Uprkos lošem vremenu, putovali smo — несмотря на плохую погоду, мы путешествовали"}],"bank":[["Iako je rok kratak, možemo završiti posao","Хотя срок короткий, мы можем закончить работу"],["Uprkos kašnjenju, stigli smo na vreme","Несмотря на задержку, мы прибыли вовремя"],["Premda se ne slažem, razumem tvoje razloge","Хотя я не согласен, я понимаю твои причины"],["Bez obzira na to što je teško, nećemo odustati","Несмотря на то что это трудно, мы не откажемся"],["Nije prihvatio ponudu, mada je bila veoma povoljna","Он не принял предложение, хотя оно было очень выгодным"],["S jedne strane, troškovi su manji, dok su rizici veći","С одной стороны, расходы меньше, тогда как риски выше"],["Ipak, postoje razlozi zbog kojih treba sačekati","Тем не менее есть причины, по которым следует подождать"],["Koliko god da pokušavamo, rezultat nije stabilan","Как бы мы ни старались, результат нестабилен"],["Iako je odluka već doneta, možemo razgovarati o detaljima","Хотя решение уже принято, мы можем обсудить детали"],["Nasuprot očekivanjima, potražnja je porasla","Вопреки ожиданиям, спрос вырос"],["Uprkos svim teškoćama, projekat je uspešno završen","Несмотря на все трудности, проект успешно завершён"],["Dok jedni podržavaju predlog, drugi mu se protive","Пока одни поддерживают предложение, другие выступают против него"],["Slažem se sa ciljem, ali ne i sa predloženim načinom","Я согласен с целью, но не с предложенным способом"],["Čak i ako ne uspemo danas, nastavićemo sutra","Даже если сегодня не получится, мы продолжим завтра"],["Ma koliko pažljivo planirali, ne možemo predvideti sve","Как бы тщательно мы ни планировали, мы не можем предвидеть всё"],["Rezultat je dobar, premda nije idealan","Результат хороший, хотя и не идеальный"]]},{"id":"b2-08","lv":"B2","t":"Номинализация и официальный регистр","n":"В деловом и официальном стиле действия часто выражаются не глаголами, а существительными: «проведение анализа», «изменение условий», «предоставление документов». Такие конструкции делают текст компактным, но могут перегружать его. Учитесь выбирать между ясным глагольным предложением и официальной номинальной формой, правильно управлять предлогами и падежами.","ruNarration":"Модуль посвящён разнице между разговорной и официальной речью. В документах часто используются существительные, образованные от глаголов, а также устойчивые обороты с предлогами. Важно не просто узнавать такие сочетания, но и уметь преобразовать их в более простую фразу, когда официальный стиль не нужен.","detail":[{"t":"От глагола к существительному","b":"Номинализация превращает действие в название процесса или результата.","e":"analizirati — анализировать; analiza — анализ; podneti zahtev — подать запрос; podnošenje zahteva — подача запроса"},{"t":"Устойчивые официальные обороты","b":"Официальные формулировки часто требуют устойчивых сочетаний и точного управления.","e":"u skladu sa pravilima — в соответствии с правилами; u vezi sa prijavom — в связи с заявлением"}],"bank":[["U skladu sa vašim zahtevom šaljemo dodatne informacije","В соответствии с вашим запросом направляем дополнительную информацию"],["U vezi sa prijavom potrebna je dodatna dokumentacija","В связи с заявлением требуется дополнительная документация"],["Na osnovu dostavljenih podataka doneta je odluka","На основании предоставленных данных принято решение"],["Prilikom obrade zahteva proveravaju se svi dokumenti","При обработке запроса проверяются все документы"],["Zbog nedostatka informacija postupak je obustavljen","Из-за недостатка информации процедура приостановлена"],["Molimo vas za dostavljanje potvrde o uplati","Просим вас предоставить подтверждение оплаты"],["Nakon završetka analize biće pripremljen izveštaj","После завершения анализа будет подготовлен отчёт"],["Izvršena je promena uslova korišćenja","Было выполнено изменение условий использования"],["Potrebno je izvršiti proveru navedenih podataka","Необходимо провести проверку указанных данных"],["Obaveštavamo vas o početku primene novih pravila","Уведомляем вас о начале применения новых правил"],["U slučaju dodatnih pitanja obratite se službi podrške","В случае дополнительных вопросов обратитесь в службу поддержки"],["Rok za podnošenje dokumentacije ističe u petak","Срок подачи документации истекает в пятницу"],["Nakon prijema uplate poslaćemo vam potvrdu","После получения оплаты мы отправим вам подтверждение"],["Cilj sastanka je razmatranje predloženih izmena","Цель встречи — рассмотрение предложенных изменений"],["Došlo je do privremenog prekida usluge","Произошёл временный перерыв в работе услуги"],["Zahvaljujemo vam na blagovremenom odgovoru","Благодарим вас за своевременный ответ"]]},{"id":"b2-09","lv":"B2","t":"Модальность, вероятность и оттенки значения","n":"На продвинутом уровне важно различать обязанность, рекомендацию, возможность, предположение и уверенный вывод. Одно и то же содержание можно выразить категорично или осторожно. Используйте модальные глаголы и безличные конструкции осознанно, учитывая контекст, статус собеседника и степень уверенности.","ruNarration":"Здесь учимся выражать не только сам факт, но и отношение к нему: насколько мы уверен  for(const re of pref){

function mk(it,pool){
  const tp=[],phrase=it.sr.split(" ").length>=3,b=box(it);
  if(it.e)tp.push("pic","hearPic");tp.push("tr","hearTr");
  if(it.lv==="B1"||it.lv==="B2"){if(phrase)tp.push("build","build");tp.push("type");if(b>=1)tp.push("speak")}
  else if(b>=1){tp.push("type","speak");if(phrase)tp.push("build")}
  if(b>=2&&phrase)tp.push("build","build");
  return{it,type:tp[Math.random()*tp.length|0],pool};
}
function lesson(items,u,ex){
  const pool=ex?ex.pool:u?u.items:ALL;

  let lessonTheoryShown=false;const done=()=>{if(ex)return ex.done(sc,Q);touchStreak();const flag=Q.filter(q=>q.w).length>Q.length/2;if(flag){Q.forEach(q=>{if(S.p[q.it.id])S.p[q.it.id].d=Date.now()});save()}m.innerHTML=`<p class="completion-title">Урок завершён</p><div class="sc">${sc} / ${Q.length}</div><p>${sc>=Q.length*.8?"Отлично. Эти слова вернутся в повторение через несколько дней.":"Ошибки вернутся в повторение уже завтра, так и закрепляется память."}</p>${flag?'<div class="note">Больше половины ответов неверные, поэтому слова из этого урока отправлены в повторение.</div>':""}<div class="row"><button class="btn pri" id="ok">На главную</button></div>`;$("#ok").onclick=home};
  const next=()=>{n++;n>=Q.length?done():step()};

  function opts(correct,make,cls){const o=shuf([correct,...shuf(pool.filter(x=>x.id!==correct.id)).slice(0,3)]);return o.map(x=>`<button class="opt ${cls||""}" data-id="${x.id}">${make(x)}</button>`).join("")}
  function choose(box,it){box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const ok=b.dataset.id===it.id;box.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.id===it.id)x.classList.add("ok")});if(!ok)b.classList.add("bad");if(it.type!=="hearTr")say(it.sr);fin(it,ok,m)})}

PR.push(...ADV_DIALOGUES.map(d=>({id:d.id,t:d.t,c:d.c,units:d.units,st:d.st})));
const expand=a=>{const g=a.match(/\[[^\]]*\]/g)||[];let r=[a];g.forEach(x=>{const n=[];r.forEach(y=>{n.push(y.replace(x,x.slice(1,-1)));n.push(y.replace(x,""))});r=n});return r.map(y=>({s:y.replace(/\s+/g," ").replace(/\s+([,.!?])/g,"$1").trim()}))};
function practice(id){
  const P=PR.find(x=>x.id===id),St=P.st.map(x=>{const[n,nr,t,a,x2,h,tp]=x.split("|"),V=a.split(";").flatMap(expand);return{n,nr,t,a:V[0].s,V,x:x2,h,tp}});
  let i=0,first=0,err=false,retry=false,listen=false,rev=false;const H=[];
  const words=a=>a.replace(/[.?!,]/g,"").split(" "),norm=a=>lat(a).replace(/[^a-zčćšžđ ]/g,"").replace(/\s+/g," ").trim();

  npc(St[0].n,St[0].nr);
  function end(){touchStreak();const k="pr_"+id,flag=St.length-first>St.length/2;if(!S.c[k]||S.c[k].s<first)S.c[k]={s:first,n:St.length};if(flag)S.rv["p:"+id]=1;else delete S.rv["p:"+id];save();
    m.innerHTML=`<p class="cap">Диалог завершён</p><div class="sc">${first} / ${St.length}</div><p>${first===St.length?"Ни одной ошибки с первого раза. Попробуйте режим на слух.":"Ответы, где собеседник вас поправлял, лучше пройти ещё раз."}</p>${flag?'<div class="note">Больше половины реплик с ошибками: диалог добавлен в повторение.</div>':""}<div class="row"><button class="btn" id="a1">Ещё раз</button><button class="btn pri" id="a2">На главную</button></div>`;$("#a1").onclick=()=>practice(id);$("#a2").onclick=home}
  function draw(){
    if(i>=St.length)return end();
    const last=H.map(x=>x.w).lastIndexOf("n"),q=St[i];
    let h=`<p class="cap">Диалог: ${P.t}</p><div class="row" style="margin:0 0 10px"><button class="btn sm" id="bk">Назад</button><button class="btn sm" id="ls">${listen?"Режим на слух: вкл":"Режим на слух: выкл"}</button></div>`;
    h+=H.map((x,k)=>x.w==="t"?`<div class="note">💡 ${x.s}</div>`:x.w==="n"?`<div class="ln" data-k="${k}"><span class="av">${P.c}</span><div class="bub${listen&&!rev&&k===last?" ph":""}">${listen&&!rev&&k===last?"🔊 Нажмите и послушайте":sr(x.s)+"<small>"+x.r+"</small>"}</div></div>`:`<div class="ln rt"><span class="av">🙋</span><div class="bub${x.b?" bad":""}">${sr(x.s)}</div></div>`).join("");
    const ws=retry?words(q.a):[...words(q.a),...q.x.split(" ")];
    h+=`<p class="cap" style="margin-top:14px">${retry?"Повторите правильную фразу":"Ваш ответ: "+q.t}</p>${retry?`<div class="note">${q.h}</div>`:""}<div class="tiles ans" id="ans"></div><div class="tiles" id="bank">${shuf(ws).map(w=>`<button class="tile" data-w="${w}">${sr(w)}</button>`).join("")}</div><div class="row"><button class="btn pri" id="ck">Ответить</button></div>`;
    m.innerHTML=h;
    m.querySelectorAll(".ln[data-k]").forEach(l=>l.onclick=()=>{const x=H[+l.dataset.k];say(x.s);if(+l.dataset.k===last&&listen){rev=true;draw()}});
    $("#bk").onclick=home;$("#ls").onclick=()=>{listen=!listen;draw()};
    m.querySelectorAll(".tile").forEach(t=>t.onclick=()=>(t.parentNode.id==="ans"?$("#bank"):$("#ans")).appendChild(t));
    $("#ck").onclick=()=>{
      const g=[...$("#ans").children].map(t=>t.dataset.w);if(!g.length)return;
      const gn=norm(g.join(" ")),v=q.V.find(x=>norm(x.s)===gn);
      if(v){const sh=v.s.charAt(0).toUpperCase()+v.s.slice(1);H.push({w:"u",s:sh});say(sh);if(!err)first++;
        const kt=(q.tp||"~").split("~"),tip=kt[0]&&!gn.split(" ").includes(lat(kt[0]))?kt[1]:"";if(tip)H.push({w:"t",s:tip});
        const re=err?["Tako je!","Так!"]:tip?["Dobro!","Хорошо!"]:["Odlično!","Отлично!"];err=false;retry=false;i++;
        if(i<St.length)npc(re[0]+" "+St[i].n,re[1]+" "+St[i].nr);else{i=St.length;end()}
      }else{
        H.push({w:"u",s:g.join(" "),b:1});err=true;retry=true;
        npc("Izvinite, ne razumem. Mislite li: „"+q.a.replace(/[.!]$/,"")+"“?","Простите, не понимаю. Вы имеете в виду: «"+q.a.replace(/[.!]$/,"")+"»?");
      }
      if(i<St.length)draw()};
    window.scrollTo(0,document.body.scrollHeight);
  }
  draw();
}

зыковом курсе","c":"👩‍🏫","st":["Zdravo! Kako se zoveš?|Привет! Как тебя зовут?|Ответьте: меня зовут Кирилл|Zovem se Kirill|ja zove Kirill|Zovem se… — стандартный ответ на вопрос об имени.","Odakle si, Kirill?|Откуда ты, Кирилл?|Скажите: я из России|Ja sam iz Rusije|ja u Rusija|Iz + родительный падеж: iz Rusije.","Drago mi je! Govoriš li srpski?|Приятно познакомиться! Ты говоришь по-сербски?|Скажите: я немного говорю|Govorim malo srpski|govoriš srpska malo|Govorim — «я говорю»; malo — «немного»."]},{"t":"Вежливое обращение в магазине","c":"🧑‍💼","st":["Dobar dan! Mogu li da pomognem?|Добрый день! Могу помочь?|Попросите говорить медленнее|Govorite sporije, molim vas|govori sporije ja|К незнакомому человеку — вежливая форма govorite.","Naravno. Da li razumete?|Конечно. Вы понимаете?|Скажите: да, спасибо|Da, hvala|ne, molim|Da — «да», hvala — «спасибо».","Izvolite, prijatan dan!|Пожалуйста, хорошего дня!|Попрощайтесь вежливо|Doviđenja i prijatan dan|zdravo kako si|Doviđenja — нейтральное вежливое прощание."]}],"comics":[{"t":"Комикс: знакомство в языковой школе","pn":[{"s":"🏫👋","l":["M|Zdravo, ja sam Marko.|Привет, я Марко.","A|Zdravo! Ja sam Kirill.|Привет! Я Кирилл."]},{"s":"🌍💬","l":["M|Odakle dolaziš?|Откуда ты?","A|Dolazim iz Rusije.|Я из России."]},{"s":"📚🙂","l":["M|Dobro došao na kurs!|Добро пожаловать на курс!","A|Hvala! Želim da učim srpski.|Спасибо! Я хочу учить сербский."]}]},{"t":"Комикс: просим повторить","pn":[{"s":"🛍️🗣️","l":["B|Izvolite, šta želite?|Пожалуйста, что вы хотите?","g|Izvinite, ne razumem.|Извините, я не понимаю."]},{"s":"🐢💬","l":["g|Možete li sporije, molim vas?|Не могли бы вы помедленнее, пожалуйста?","B|Naravno, nema problema.|Конечно, без проблем."]},{"s":"😊✅","l":["B|Da li je sada bolje?|Теперь лучше?","g|Da, mnogo bolje. Hvala!|Да, намного лучше. Спасибо!"]}]}]},{"u":"c","dialogs":[{"t":"Встреча: договориться о времени","c":"👨‍🏫","st":["Kada počinje čas?|Когда начинается урок?|Скажите: в три часа|Čas počinje u tri sata|čas počinje tri dan ите что-нибудь ещё?|Скажите: нет, спасибо|Ne, hvala|da još račun|Ne — «нет», hvala — «спасибо».","To je sve?|Это всё?|Спросите, сколько стоит заказ|Koliko košta?|koliko je gde|Koliko košta? — «Сколько стоит?»"]},{"t":"В пекарне: купить завтрак","c":"🥐","st":["Dobar dan! Izvolite.|Добрый день! Слушаю вас.|Попросите два круассана|Dva kroasana, molim|dve kroasan voda|Kroasan — мужской род: dva kroasana.","Želite li jogurt?|Хотите йогурт?|Ответьте: да, один йогурт|Da, jedan jogurt|jedna jogurt|Мужской род: jedan jogurt.","Još nešto?|Что-нибудь ещё?|Скажите: нет, это всё|Ne, to je sve|ne to nisu|To je sve — «это всё»."]}],"comics":[{"t":"Комикс: завтрак в кафе","pn":[{"s":"☕🥐","l":["K|Dobro jutro! Šta želite?|Доброе утро! Что желаете?","g|Jednu kafu i kroasan, molim.|Один кофе и круассан, пожалуйста."]},{"s":"💧🧾","l":["K|Želite li i vodu?|Хотите ещё воду?","g|Da, jednu vodu.|Да, одну воду."]},{"s":"💳🙂","l":["g|Koliko košta sve zajedno?|Сколько всё вместе стоит?","K|Trista dinara.|Триста динаров."]}]},{"t":"Комикс: покупаем продукты","pn":[{"s":"🧀🍅","l":["B|Izvolite, šta vam treba?|Пожалуйста, что вам нужно?","g|Treba mi sir i paradajz.|Мне нужны сыр и помидоры."]},{"s":"⚖️🛍️","l":["B|Koliko sira želite?|Сколько сыра хотите?","g|Dvesta grama, molim.|Двести граммов, пожалуйста."]},{"s":"🙏🥖","l":["B|Još nešto?|Что-нибудь ещё?","g|Ne, hvala. To je sve.|Нет, спасибо. Это всё."]}]}]},{"u":"e","dialogs":[{"t":"На улице: спросить дорогу","c":"🚶","st":["Izvinite, gde je autobuska stanica?|Извините, где автобусная остановка?|Спросите, далеко ли она|Da li je daleko?|gde daleko kako|Da li…? — вопрос с ответом «да/нет».","Nije daleko. Idite pravo.|Недалеко. Идите прямо.|Попросите повторить|Možete li da ponovite?|ponovi ja pravo|Možete li da… — вежливая просьба.","Skrenite desno kod banke.|Поверните направо у банка.|Поблагодарите за помощь|Hvala vam na pomoći|hvala pomoć gde|Na pomoći — устойчивое сочетание со значением «за помощь»."]},{"t":"В такси: объяснить адрес","c":"🚕","st":["Do
